<body>

    <!-- ═══ TOPBAR ═══ -->

                <label class="side-burger" id="burger-container" for="burger">

            <a href="../dashboard" class="side-link" id="nav-home" title="首頁">

            <a href="../generate" class="side-link" id="nav-generate" title="新建分鏡">

                <span>新建分鏡</span>

                </div>

            </div>
            <a href="../history" class="side-link" id="nav-history" title="資源回收桶">

                <span>資源回收桶</span>
                <div class="link-glow"></div>
            </a>
            <a href="../template" class="side-link" id="nav-template" title="爆點模板庫">
                <img src="../icon/search-blur.svg" alt="" style="z-index: 2; opacity: 1;">

        <div class="side-footer">

    <!-- ═══ MAIN CONTENT ═══ -->
    <main id="page-main" class="dash-main home-main">
        <!-- Welcome Section -->
        <section class="home-welcome anim-fadeInUp">
            <h1 class="welcome-title">歡迎回來，<span id="home-user-name">創作者</span> ✦</h1>
            <p class="welcome-subtitle">今天想創作什麼樣的分鏡故事呢？</p>
        </section>

        <!-- Welcome & Quickstart Section -->
        <section class="home-hero-section anim-fadeInUp anim-delay-1">
            <div class="home-hero-grid">
                <!-- Left Banner Card: Create Storyboard -->
                <div class="hero-banner-card" onclick="spaNavigate('generate')">
                    <div class="hero-banner-content">
                        <span class="hero-banner-badge">AI 創作助理</span>
                        <h2 class="hero-banner-title">靈感，一鍵轉換</h2>
                        <p class="hero-banner-desc">輸入故事，一鍵智慧分析分鏡、編排鏡頭並生成精美畫面與鏡頭動態描述。</p>
                        <button class="hero-banner-btn">
                            <span>立刻新建分鏡</span>
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                                <line x1="5" y1="12" x2="19" y2="12"></line>
                                <polyline points="12 5 19 12 12 19"></polyline>
                            </svg>
                        </button>
                    </div>
                    <div class="hero-banner-media">
                        <img src="../images/home_hero_banner.png" alt="Creative Illustration" class="hero-media-img">
                    </div>
                </div>

                <!-- Right Quickstart Grid -->
                <div class="hero-quick-grid">
                    <!-- Template Card -->
                    <div class="quick-widget-card template-widget" onclick="spaNavigate('template')">
                        <div class="widget-icon">
                            <img src="../icon/search-focus.svg" alt="Templates">
                        </div>
                        <div class="widget-content">
                            <h3>爆點模板庫</h3>
                            <p>套用最熱門的短影音腳本</p>
                        </div>
                        <div class="widget-arrow">→</div>
                    </div>
                    
                    <!-- Recycle Bin Card -->
                    <div class="quick-widget-card recycle-widget" onclick="spaNavigate('history')">
                        <div class="widget-icon">
                            <img src="../icon/trash-focus.svg" alt="Recycle Bin">
                        </div>
                        <div class="widget-content">
                            <h3>資源回收桶</h3>
                            <p>復原或清理軟刪除分鏡</p>
                        </div>
                        <div class="widget-arrow">→</div>
                    </div>
                </div>
            </div>
        </section>

        <!-- Recent Projects Section -->
        <section class="projects-management anim-fadeInUp anim-delay-2" style="margin-top: 56px;">
            <div class="projects-header">
                <h2 class="projects-title" style="font-size: 1.5rem;">最近編輯分鏡</h2>
                <a onclick="spaNavigate('projects')" style="cursor: pointer; display: flex; align-items: center; gap: 5px; color: var(--primary); text-decoration: none; font-weight: 600; font-size: 0.95rem;">
                    查看所有分鏡
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="9 18 15 12 9 6"></polyline>
                    </svg>

            </div>
            
            <div class="projects-grid" id="recent-projects-grid">
                <!-- Recent projects will be dynamically rendered here -->

                </div>
            </div>
        </section>
    </main>



    <!-- Mobile User Panel Scrim Backdrop -->
    <div class="user-panel-backdrop" id="spa-user-panel-backdrop"></div>

    <!-- User Tooltip Panel -->

        <div class="up-header">
            <div class="up-avatar">黃</div>
            <div>

                <p class="up-email">aaaa@bbbb.edu.tw</p>
            </div>
            <div class="up-plan">Free</div>
        </div>
        <div class="up-divide"></div>
        <div class="up-body">
            <a class="up-btn"><img src="../icon/profile.svg" alt=""><span>個人檔案</span></a>
            <a class="up-btn"><img src="../icon/upgrade.svg" alt=""><span>升級方案</span></a>
            <a href="../history" class="up-btn" id="up-recycle-bin"><img src="../icon/trash-blur.svg" alt=""><span>資源回收桶</span></a>
            <a class="up-btn"><img src="../icon/setting.svg" alt=""><span>設定</span></a>
        </div>

        <a href="../html/login.html" class="up-btn up-logout"><img src="../icon/logout.svg" alt=""><span>登出</span></a>

    <!-- Mobile Portrait Floating Bottom Navigation -->

        <a href="../dashboard" class="mobile-nav__item active" id="mob-nav-home" role="tab" aria-selected="true" aria-label="首頁" draggable="false">
            <div class="mobile-nav__icon-wrap">
                <svg class="mobile-nav__svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
                    <polyline points="9 22 9 12 15 12 15 22"></polyline>
                </svg>
            </div>
            <span class="mobile-nav__label">首頁</span>
        </a>
        <a href="../projects" class="mobile-nav__item" id="mob-nav-projects" role="tab" aria-selected="false" aria-label="分鏡" draggable="false">
            <div class="mobile-nav__icon-wrap">
                <svg class="mobile-nav__svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path>
                </svg>
            </div>
            <span class="mobile-nav__label">分鏡</span>
        </a>
        <a href="../generate" class="mobile-nav__item mobile-nav__item--create" id="mob-nav-generate" role="tab" aria-selected="false" aria-label="新建分鏡" draggable="false">

                </div>
                <div class="mob-circle-progress-fill" id="mob-circle-progress-fill"></div>
                <div class="mob-circle-inner">
                    <span class="mob-circle-spark">✦</span>
                    <span class="mob-circle-text" id="mob-circle-text" style="display:none;"></span>
                </div>
            </div>
        </a>
        <a href="../template" class="mobile-nav__item" id="mob-nav-template" role="tab" aria-selected="false" aria-label="模板" draggable="false">
            <div class="mobile-nav__icon-wrap">
                <svg class="mobile-nav__svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
                    <line x1="3" y1="9" x2="21" y2="9"></line>
                    <line x1="9" y1="21" x2="9" y2="9"></line>
                </svg>
            </div>
            <span class="mobile-nav__label">模板</span>
        </a>
        <button type="button" class="mobile-nav__item" id="mob-nav-profile" role="tab" aria-selected="false" aria-label="我的設定" draggable="false">
            <div class="mobile-nav__icon-wrap">
                <svg class="mobile-nav__svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                    <circle cx="12" cy="7" r="4"></circle>
                </svg>
            </div>
            <span class="mobile-nav__label">我的</span>
        </button>
    </nav>

    <script src="../js/generate-prefill-path.js"></script>
    <script src="../js/dashboard.js"></script>
    <script src="../js/sys.js"></script>
    <script>
        function launchGenerate() {
            const storyInput = document.getElementById('dash-story');
            if (!storyInput) {
                window.location.href = './generate.html';
                return;
            }
            const story = storyInput.value.trim();
            const ratio = document.getElementById('dash-ratio')?.value || '16:9';
            const styleIdx = document.getElementById('dash-style')?.value || '0';

            if (!story) {
                storyInput.focus();
                document.querySelector('.idea-box')?.classList.add('shake');
                setTimeout(() => document.querySelector('.idea-box')?.classList.remove('shake'), 600);
                return;
            }

            sessionStorage.setItem('sb_story', story);
            sessionStorage.setItem('sb_ratio', ratio);
            sessionStorage.setItem('sb_styleIdx', styleIdx);
            sessionStorage.setItem('sb_skipToStep', '3');

            window.location.href = './generate.html';
        }

        const dashStory = document.getElementById('dash-story');
        if (dashStory) {
            dashStory.addEventListener('keydown', function (e) {
                if (e.key === 'Enter' && !e.shiftKey) {
                    e.preventDefault();
                    launchGenerate();
                }
            });
        }

        const topAvatar = document.getElementById('top-avatar');
        if (topAvatar) {
            topAvatar.addEventListener('click', function (e) {
                e.stopPropagation();
                if (typeof window.toggleUserPanel === 'function') {
                    window.toggleUserPanel();
                } else {
                    const panel = document.getElementById('user-panel') || document.getElementById('spa-user-panel');
                    const backdrop = document.getElementById('spa-user-panel-backdrop');
                    if (panel) panel.classList.toggle('active');
                    if (backdrop && panel) backdrop.classList.toggle('active', panel.classList.contains('active'));
                }
            });
        }

        const backdropEl = document.getElementById('spa-user-panel-backdrop');
        if (backdropEl) {
            backdropEl.addEventListener('click', (e) => {
                e.preventDefault();
                e.stopPropagation();
                if (typeof window.toggleUserPanel === 'function') {
                    window.toggleUserPanel(false);
                } else {
                    const panel = document.getElementById('user-panel') || document.getElementById('spa-user-panel');
                    if (panel) panel.classList.remove('active');
                    backdropEl.classList.remove('active');
                }
            });
        }

        document.addEventListener('click', (e) => {
            if (window.__justHandledPointerNav && (Date.now() - window.__justHandledPointerNav) < 450) return;
            if (e && e.target && e.target.closest('#user-panel, #spa-user-panel, #top-avatar, #spa-mobile-nav, .mobile-bottom-nav')) return;
            if (typeof window.toggleUserPanel === 'function') {
                window.toggleUserPanel(false);
            } else {
                const panel = document.getElementById('user-panel') || document.getElementById('spa-user-panel');
                if (panel) panel.classList.remove('active');
                const backdrop = document.getElementById('spa-user-panel-backdrop');
                if (backdrop) backdrop.classList.remove('active');
            }
        });
    </script>
</body>

</html>
