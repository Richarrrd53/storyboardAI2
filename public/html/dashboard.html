<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Dashboard — Storyboard AI</title>
    <link rel="stylesheet" href="../css/style.css" />
    <link rel="stylesheet" href="../css/dashboard.css" />
    <link rel="stylesheet" href="../css/generate.css" />
    <link rel="stylesheet" href="../css/math-curve-loader.css" />
</head>

<body>

    <!-- Dynamic BG -->
    <div id="BG">

    </div>

    <!-- ═══ TOPBAR ═══ -->
    <header class="sidebar" id="dash-sidebar">
        <div class="side-header">
            <a class="side-logo brand-logo" id="side-logo">
                <span>LOGO</span>
                <div class="logo-text">Storyboard<span>AI</span></div>
                <label class="side-burger" id="burger-container" for="burger">
                    <input type="checkbox" id="burger">
                    <span></span>
                    <span></span>
                    <span></span>
                </label>
            </a>
        </div>

        <nav class="side-body">

            
            
            <a href="../dashboard" class="side-link" id="nav-home" title="首頁">
                <img src="../icon/home-blur.svg" alt="" style="z-index: 2; opacity: 1;">
                <span>首頁</span>
                <div class="link-glow"></div>
            </a>
            <a href="../generate" class="side-link" id="nav-generate" title="新建分鏡">
                <img src="../icon/plus-blur.svg" alt="" style="z-index: 2; opacity: 1;">
                <span>新建分鏡</span>
                <div class="link-glow"></div>
            </a>
            <div class="side-nav-group" id="nav-projects-group">
                <div class="side-link-row">
                    <a href="../projects" class="side-link" id="nav-projects" title="分鏡">
                        <img src="../icon/folder-blur.svg" alt="" style="z-index: 2; opacity: 1;">
                        <span>分鏡</span>
                        <div class="link-glow"></div>
                    </a>
                    <button class="sub-list-toggle" id="projects-toggle-btn" title="展開/收疊分鏡" type="button">
                        <svg class="toggle-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round">
                            <line x1="5" y1="12" x2="19" y2="12"></line>
                            <line x1="12" y1="5" x2="12" y2="19" class="toggle-vertical-line"></line>
                        </svg>
                    </button>
                </div>
                <div class="side-sub-list" id="sidebar-projects-list">
                </div>
            </div>
            <a href="../history" class="side-link" id="nav-history" title="資源回收桶">
                <img src="../icon/trash-blur.svg" alt="" style="z-index: 2; opacity: 1;">
                <span>資源回收桶</span>
                <div class="link-glow"></div>
            </a>
            <a href="../template" class="side-link" id="nav-template" title="爆點模板庫">
                <img src="../icon/search-blur.svg" alt="" style="z-index: 2; opacity: 1;">
                <span>爆點模板庫</span>
                <div class="link-glow"></div>
            </a>
            <a href="/discovery" target="_top" class="side-link desktop-only-link" id="nav-discovery" title="熱門短影音搜尋">
                <img src="../icon/search-focus.svg" alt="" style="z-index: 2; opacity: 1;">
                <span>熱門短影音搜尋</span>
                <div class="link-glow"></div>
            </a>
        </nav>

        <div class="side-footer">
            <div class="top-avatar" id="top-avatar">黃</div>
        </div>
    </header>

    <!-- ═══ MAIN CONTENT ═══ -->
    <main id="page-main" class="dash-main home-main">
        <!-- Welcome Section -->
        <section class="home-welcome anim-fadeInUp">
            <h1 class="welcome-title">歡迎回來，<span id="home-user-name">創作者</span> ✦</h1>
            <h2 class="welcome-subtitle">今天想繼續哪個創作？</h2>
        </section>

        <!-- Featured / Continue / Discovery Surface -->
        <section class="home-hero-section anim-fadeInUp anim-delay-1">
            <div class="home-hero-grid">
                <!-- Left Hero Card: Continue Project / Discovery -->
                <div class="hero-continue-card" id="home-hero-card">
                    <div class="hero-continue-main">
                        <div class="hero-badge" id="hero-badge">
                            <span class="hero-badge-dot"></span>
                            <span id="hero-badge-text">繼續你的創作</span>
                        </div>
                        <h2 class="hero-card-title" id="hero-project-title">載入中...</h2>
                        <div class="hero-meta-row" id="hero-meta-row">
                            <span class="hero-meta-item" id="hero-project-time">
                                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <circle cx="12" cy="12" r="10"></circle>
                                    <polyline points="12 6 12 12 16 14"></polyline>
                                </svg>
                                <span id="hero-time-text">上次編輯：--</span>
                            </span>
                            <span class="hero-meta-dot">•</span>
                            <span class="hero-meta-item" id="hero-project-shots">
                                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <rect x="2" y="2" width="20" height="20" rx="2.18" ry="2.18"></rect>
                                    <line x1="7" y1="2" x2="7" y2="22"></line>
                                    <line x1="17" y1="2" x2="17" y2="22"></line>
                                    <line x1="2" y1="12" x2="22" y2="12"></line>
                                </svg>
                                <span id="hero-shots-text">目前進度：--</span>
                            </span>
                        </div>
                        <div class="hero-actions-row" id="hero-actions-row">
                            <button class="hero-primary-btn" id="hero-continue-btn" type="button">
                                <span id="hero-primary-btn-text">繼續編輯</span>
                                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                                    <line x1="5" y1="12" x2="19" y2="12"></line>
                                    <polyline points="12 5 19 12 12 19"></polyline>
                                </svg>
                            </button>
                            <a class="hero-secondary-link" id="hero-secondary-link" href="javascript:void(0)" onclick="spaNavigate('projects')">
                                查看所有分鏡
                            </a>
                        </div>
                    </div>
                    <div class="hero-preview-visual" id="hero-preview-visual">
                        <div class="hero-work-showcase" id="hero-preview-card" style="cursor: pointer;">
                            <div class="hero-showcase-backdrop"></div>
                            <div class="hero-showcase-frame">
                                <div class="hero-showcase-thumb loading" id="hero-preview-thumb">
                                    <div class="hero-frame-mockup">
                                        <div class="mockup-clapper">🎬</div>
                                        <div class="mockup-title">載入中...</div>
                                        <div class="mockup-sub">分鏡腳本</div>
                                    </div>
                                </div>
                                <div class="hero-showcase-grid-overlay">
                                    <span class="crosshair-marker tl"></span>
                                    <span class="crosshair-marker tr"></span>
                                    <span class="crosshair-marker bl"></span>
                                    <span class="crosshair-marker br"></span>
                                </div>
                                <div class="hero-showcase-meta">
                                    <span class="hero-showcase-pill"><span class="pill-dot"></span><span id="hero-preview-ratio">16:9</span></span>
                                    <span class="hero-showcase-scene">Scene 01</span>
                                </div>
                            </div>
                            <div class="hero-mini-shot-badge">
                                <span class="mini-shot-icon">🎥</span>
                                <div class="mini-shot-text">
                                    <span class="mini-shot-label">SHOTS</span>
                                    <span class="mini-shot-val" id="hero-mini-shot-val">--</span>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Right Quickstart Grid -->
                <div class="hero-quick-grid">
                    <!-- Template Card -->
                    <div class="quick-widget-card template-widget" onclick="spaNavigate('template')">
                        <div class="widget-icon">
                            <img src="../icon/search-focus.svg" alt="Templates">
                        </div>
                        <div class="widget-content">
                            <h3>爆點模板庫</h3>
                            <p>套用最熱門的短影音腳本</p>
                        </div>
                        <div class="widget-arrow">→</div>
                    </div>
                    
                    <!-- Recycle Bin Card -->
                    <div class="quick-widget-card recycle-widget" onclick="spaNavigate('history')">
                        <div class="widget-icon">
                            <img src="../icon/trash-focus.svg" alt="Recycle Bin">
                        </div>
                        <div class="widget-content">
                            <h3>資源回收桶</h3>
                            <p>復原或清理軟刪除分鏡</p>
                        </div>
                        <div class="widget-arrow">→</div>
                    </div>
                </div>
            </div>
        </section>

        <!-- Recent Projects Section -->
        <section class="projects-management anim-fadeInUp anim-delay-2" style="margin-top: 36px;">
            <div class="projects-header">
                <h2 class="projects-title" style="font-size: 1.5rem;">最近編輯分鏡</h2>
                <a onclick="spaNavigate('projects')" style="cursor: pointer; display: flex; align-items: center; gap: 5px; color: var(--primary); text-decoration: none; font-weight: 600; font-size: 0.95rem;">
                    查看所有分鏡
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="9 18 15 12 9 6"></polyline>
                    </svg>
                </a>
            </div>
            
            <div class="projects-grid" id="recent-projects-grid">
                <!-- Recent projects will be dynamically rendered here -->
                <div class="projects-empty">
                    <h3>載入中...</h3>
                </div>
            </div>
        </section>
    </main>



    <!-- Mobile User Panel Scrim Backdrop -->
    <div class="user-panel-backdrop" id="spa-user-panel-backdrop"></div>

    <!-- User Tooltip Panel -->
    <div class="user-panel" id="user-panel">
        <div class="user-panel-handle" aria-hidden="true"></div>
        <div class="up-header">
            <div class="up-avatar">黃</div>
            <div>
                <p class="up-name">黃晟銘</p>
                <p class="up-email">aaaa@bbbb.edu.tw</p>
            </div>
            <div class="up-plan">Free</div>
        </div>
        <div class="up-divide"></div>
        <div class="up-body">
            <a class="up-btn"><img src="../icon/profile.svg" alt=""><span>個人檔案</span></a>
            <a class="up-btn"><img src="../icon/upgrade.svg" alt=""><span>升級方案</span></a>
            <a href="../history" class="up-btn" id="up-recycle-bin"><img src="../icon/trash-blur.svg" alt=""><span>資源回收桶</span></a>
            <a class="up-btn"><img src="../icon/setting.svg" alt=""><span>設定</span></a>
        </div>
        <div class="up-divide"></div>
        <a href="../html/login.html" class="up-btn up-logout"><img src="../icon/logout.svg" alt=""><span>登出</span></a>
    </div>

                </div>
                <span class="mobile-nav__label">分鏡</span>
            </a>

    <script src="../js/dashboard.js"></script>
    <script src="../js/sys.js"></script>
    <script>
        function launchGenerate() {
            const storyInput = document.getElementById('dash-story');
            if (!storyInput) {
                window.location.href = './generate.html';
                return;
            }
            const story = storyInput.value.trim();
            const ratio = document.getElementById('dash-ratio')?.value || '16:9';
            const styleIdx = document.getElementById('dash-style')?.value || '0';

            if (!story) {
                storyInput.focus();
                document.querySelector('.idea-box')?.classList.add('shake');
                setTimeout(() => document.querySelector('.idea-box')?.classList.remove('shake'), 600);
                return;
            }

            sessionStorage.setItem('sb_story', story);
            sessionStorage.setItem('sb_ratio', ratio);
            sessionStorage.setItem('sb_styleIdx', styleIdx);
            sessionStorage.setItem('sb_skipToStep', '3');

            window.location.href = './generate.html';
        }

        const dashStory = document.getElementById('dash-story');
        if (dashStory) {
            dashStory.addEventListener('keydown', function (e) {
                if (e.key === 'Enter' && !e.shiftKey) {
                    e.preventDefault();
                    launchGenerate();
                }
            });
        }

        const isMobileScreen = () => window.matchMedia('(max-width: 768px), (max-width: 767px) and (orientation: portrait), (max-width: 480px)').matches;

        const topAvatar = document.getElementById('top-avatar');
        if (topAvatar) {
            topAvatar.addEventListener('click', function (e) {
                e.stopPropagation();
                if (typeof window.toggleUserPanel === 'function') {
                    window.toggleUserPanel();
                } else {
                    const panel = document.getElementById('user-panel') || document.getElementById('spa-user-panel');
                    const backdrop = document.getElementById('spa-user-panel-backdrop');
                    if (panel) panel.classList.toggle('active');
                    if (isMobileScreen() && backdrop && panel) {
                        backdrop.classList.toggle('active', panel.classList.contains('active'));
                    }
                }
            });
        }

        const backdropEl = document.getElementById('spa-user-panel-backdrop');
        if (backdropEl) {
            backdropEl.addEventListener('click', (e) => {
                e.preventDefault();
                e.stopPropagation();
                if (typeof window.toggleUserPanel === 'function') {
                    window.toggleUserPanel(false);
                } else {
                    const panel = document.getElementById('user-panel') || document.getElementById('spa-user-panel');
                    if (panel) panel.classList.remove('active');
                    backdropEl.classList.remove('active');
                }
            });
        }

        document.addEventListener('click', (e) => {
            if (window.__justHandledPointerNav && (Date.now() - window.__justHandledPointerNav) < 450) return;
            if (e && e.target && e.target.closest('#user-panel, #spa-user-panel, #top-avatar, #spa-mobile-nav, .mobile-bottom-nav')) return;
            if (typeof window.toggleUserPanel === 'function') {
                window.toggleUserPanel(false);
            } else {
                const panel = document.getElementById('user-panel') || document.getElementById('spa-user-panel');
                if (panel) panel.classList.remove('active');
                const backdrop = document.getElementById('spa-user-panel-backdrop');
                if (backdrop) backdrop.classList.remove('active');
            }
        });
    </script>
