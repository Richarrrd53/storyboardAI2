
<!DOCTYPE html>
<html lang="zh-TW">

<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
	<title>資源回收桶 — Storyboard AI</title>
	<link rel="stylesheet" href="../css/style.css" />
	<link rel="stylesheet" href="../css/dashboard.css" />
	<link rel="stylesheet" href="../css/generate.css" />
	<link rel="stylesheet" href="../css/math-curve-loader.css" />
</head>

<body>
	<main id="page-main" class="page-shell page-projects dash-main history-main">
		<header class="content-header projects-header history-header anim-fadeInUp">
			<div class="history-header-main">
				<a class="history-back-btn" href="/projects" aria-label="返回專案列表"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg></a>
				<div class="history-title-group">
					<h1 class="projects-title">資源回收桶</h1>
				</div>
			</div>
			<div class="history-header-actions" id="history-header-actions" hidden>
				<button type="button" class="history-action-btn" id="history-select-mode-btn">選取</button>
			</div>
		</header>
		<div class="projects-selection-bar" id="history-selection-bar" role="toolbar" aria-label="回收桶批次操作" aria-hidden="true">
			<div class="selection-bar-info">
				<span class="selection-bar-count" id="history-selection-count">已選取 0 項</span>
			</div>
			<div class="selection-bar-actions">
				<button type="button" class="selection-bar-btn" id="history-select-all-btn">全選</button>
				<button type="button" class="selection-bar-btn ghost" id="history-cancel-select-btn">取消</button>
			</div>
		</div>
		<div class="content-body history-body anim-fadeInUp anim-delay-1" data-dynamic-mask data-mask-direction="vertical" data-mask-size="36">
			<div class="projects-grid" id="projects-grid">
				<div class="projects-empty">
					<h3>載入中...</h3>
				</div>
			</div>
		</div>
		<div class="selection-bottom-dock" id="history-bottom-dock" aria-label="回收桶底部操作">
			<div class="selection-bottom-dock-stage">
				<div class="selection-dock-group selection-dock-group--default">
					<button type="button" class="selection-dock-btn" id="history-restore-all-btn">還原全部</button>
					<button type="button" class="selection-dock-btn danger" id="history-empty-trash-btn">清空回收桶</button>
				</div>
				<div class="selection-dock-group selection-dock-group--selection" aria-hidden="true">
					<button type="button" class="selection-dock-btn primary" id="history-batch-restore-btn">還原所選</button>
					<button type="button" class="selection-dock-btn danger" id="history-batch-delete-btn">永久刪除所選</button>
				</div>
			</div>
		</div>
	</main>

	<script src="../js/generate-prefill-path.js"></script>
	<script src="../js/sys.js"></script>
</body>

</html>
