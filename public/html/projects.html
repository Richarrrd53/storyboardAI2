<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>我的分鏡 — Storyboard AI</title>
    <link rel="stylesheet" href="../css/style.css" />
    <link rel="stylesheet" href="../css/dashboard.css" />
    <link rel="stylesheet" href="../css/generate.css" />
    <link rel="stylesheet" href="../css/math-curve-loader.css" />
</head>

<body>
    <main id="page-main" class="page-shell page-projects dash-main projects-main">
        <header class="content-header projects-header anim-fadeInUp">
            <div class="projects-header-left">
                <h1 class="projects-title">我的分鏡</h1>
                <span class="projects-count-badge" id="projects-count-badge" role="status" aria-live="polite">0</span>
            </div>
            <div class="projects-header-actions">
                <button type="button" class="btn btn-primary new-project-btn" onclick="spaNavigate('generate')">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
                        <line x1="12" y1="5" x2="12" y2="19"></line>
                        <line x1="5" y1="12" x2="19" y2="12"></line>
                    </svg>
                    <span>新增分鏡</span>
                </button>
            </div>
        </header>

        <div class="projects-toolbar anim-fadeInUp" id="projects-toolbar" role="region" aria-label="分鏡標籤篩選；符合任一所選標籤即顯示">
            <div class="projects-filter-bar">
                <div class="projects-tags-scroll" id="projects-tags-scroll" role="toolbar" aria-label="標籤篩選">
                    <!-- Dynamic tag filter pills -->
                </div>
                <div class="projects-filter-actions">
                    <button type="button" class="projects-clear-filter-btn" id="projects-clear-filter-btn" style="display: none;" aria-label="清除標籤篩選">
                        清除篩選
                    </button>
                </div>
            </div>
        </div>
        
        <div class="content-body projects-body anim-fadeInUp anim-delay-1" data-dynamic-mask data-mask-direction="vertical" data-mask-size="36">
            <div class="projects-grid" id="projects-grid">
                <!-- Projects will be dynamically rendered here -->
                <div class="projects-empty">
                    <h3>載入中...</h3>
                </div>
            </div>
        </div>
    </main>

    <script src="../js/generate-prefill-path.js"></script>
    <script src="../js/sys.js"></script>
</body>

</html>
