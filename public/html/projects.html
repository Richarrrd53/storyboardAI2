<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>我的分鏡 — Storyboard AI</title>
    <link rel="stylesheet" href="../css/style.css" />
    <link rel="stylesheet" href="../css/dashboard.css" />
    <link rel="stylesheet" href="../css/generate.css" />
    <link rel="stylesheet" href="../css/math-curve-loader.css" />
</head>

<body>
    <main id="page-main" class="page-shell page-projects dash-main projects-main">
        <header class="content-header projects-header anim-fadeInUp">
            <div class="projects-header-left">
                <h1 class="projects-title">我的分鏡</h1>
                <span class="projects-count-badge" id="projects-count-badge" role="status" aria-live="polite">0</span>
            </div>
            <div class="projects-header-actions" id="projects-header-actions">
                <a class="history-back-btn projects-history-btn" id="projects-history-link" href="/history" aria-label="前往資源回收桶" title="資源回收桶">
                    <span class="quick-entry-icon-wrap" aria-hidden="true">
                        <svg class="quick-entry-icon quick-entry-icon-line" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M3 6H21"></path>
                            <path d="M19 6V20C19 21 18 22 17 22H7C6 22 5 21 5 20V6"></path>
                            <path d="M8 6V4C8 3 9 2 10 2H14C15 2 16 3 16 4V6"></path>
                        </svg>
                        <svg class="quick-entry-icon quick-entry-icon-fill" data-im-icon="trash" width="20" height="20" viewBox="0 0 24 24" fill="none">
                            <g data-im-part="lid">
                                <path d="M3 6H21" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path>
                                <path d="M8 6V4C8 3 9 2 10 2H14C15 2 16 3 16 4V6H8Z" fill="currentColor"></path>
                            </g>
                            <g data-im-part="body">
                                <path d="M19 6V20C19 21 18 22 17 22H7C6 22 5 21 5 20V6H19Z" fill="currentColor"></path>
                                <path d="M10 11V17" stroke="#fff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"></path>
                                <path d="M14 11V17" stroke="#fff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"></path>
                            </g>
                        </svg>
                    </span>
                </a>
                <button type="button" class="history-action-btn" id="projects-select-mode-btn" hidden>選取</button>
            </div>
        </header>

        <div class="projects-toolbar projects-toolbar--browse anim-fadeInUp" id="projects-toolbar" role="region" aria-label="分鏡篩選與排序" data-header-toolbar="pinned">
            <button type="button" class="projects-tool-trigger" id="projects-tags-trigger" data-morph-align="start" aria-haspopup="menu" aria-expanded="false">
                <span id="projects-tags-label">全部標籤</span><span aria-hidden="true">⌄</span>
            </button>
            <div class="projects-browse-actions">
                <label class="projects-search">
                    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5"/></svg>
                    <input id="projects-search" type="search" placeholder="搜尋分鏡" aria-label="搜尋分鏡" autocomplete="off">
                </label>
                <button type="button" class="projects-tool-trigger projects-sort-trigger" id="projects-sort-trigger" data-morph-align="end" aria-label="排序分鏡" aria-haspopup="menu" aria-expanded="false">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M7 4v16m-4-4 4 4 4-4M17 20V4m-4 4 4-4 4 4"/></svg>
                </button>
            </div>
        </div>

        <div class="projects-selection-bar" id="projects-selection-bar" role="toolbar" aria-label="專案批次操作" aria-hidden="true">
            <div class="selection-bar-info">
                <span class="selection-bar-count" id="projects-selection-count">已選取 0 項</span>
            </div>
            <div class="selection-bar-actions">
                <button type="button" class="selection-bar-btn" id="projects-select-all-btn">全選</button>
                <button type="button" class="selection-bar-btn ghost" id="projects-cancel-select-btn">取消</button>
            </div>
        </div>

        <div class="content-body projects-body anim-fadeInUp anim-delay-1" data-dynamic-mask data-mask-direction="vertical" data-mask-size="36">
            <div class="projects-grid" id="projects-grid">
                <!-- Projects will be dynamically rendered here -->
                <div class="projects-empty">
                    <h3>載入中...</h3>
                </div>
            </div>
        </div>

        <div class="selection-bottom-dock" id="projects-bottom-dock" aria-label="專案底部操作">
            <div class="selection-bottom-dock-stage">
                <div class="selection-dock-group selection-dock-group--selection" aria-hidden="true">
                    <button type="button" class="selection-dock-btn" id="projects-batch-tags-btn">編輯標籤</button>
                    <button type="button" class="selection-dock-btn danger" id="projects-batch-trash-btn">移至回收桶</button>
                </div>
            </div>
        </div>
    </main>

    <script src="../js/generate-prefill-path.js"></script>
    <script src="../js/sys.js"></script>
</body>

</html>
