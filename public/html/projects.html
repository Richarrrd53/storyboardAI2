<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>我的分鏡 — Storyboard AI</title>
    <link rel="stylesheet" href="../css/style.css" />
    <link rel="stylesheet" href="../css/dashboard.css" />
    <link rel="stylesheet" href="../css/generate.css" />
    <link rel="stylesheet" href="../css/math-curve-loader.css" />
</head>

<body>
    <main id="page-main" class="page-shell page-projects dash-main projects-main">
        <header class="content-header projects-header anim-fadeInUp">
            <div class="projects-header-left">
                <h1 class="projects-title">我的分鏡</h1>
                <span class="projects-count-badge" id="projects-count-badge" role="status" aria-live="polite">0</span>
            </div>
        </header>

        <div class="projects-toolbar projects-toolbar--browse anim-fadeInUp" id="projects-toolbar" role="region" aria-label="分鏡篩選與排序" data-header-toolbar="pinned">
            <button type="button" class="projects-tool-trigger" id="projects-tags-trigger" aria-haspopup="menu" aria-expanded="false">
                <span id="projects-tags-label">全部標籤</span><span aria-hidden="true">⌄</span>
            </button>
            <div class="projects-browse-actions">
                <label class="projects-search">
                    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5"/></svg>
                    <input id="projects-search" type="search" placeholder="搜尋分鏡" aria-label="搜尋分鏡" autocomplete="off">
                </label>
                <button type="button" class="projects-tool-trigger projects-sort-trigger" id="projects-sort-trigger" aria-label="排序分鏡" aria-haspopup="menu" aria-expanded="false">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M7 4v16m-4-4 4 4 4-4M17 20V4m-4 4 4-4 4 4"/></svg>
                </button>
            </div>
        </div>

        <div class="content-body projects-body anim-fadeInUp anim-delay-1" data-dynamic-mask data-mask-direction="vertical" data-mask-size="36">
            <div class="projects-grid" id="projects-grid">
                <!-- Projects will be dynamically rendered here -->
                <div class="projects-empty">
                    <h3>載入中...</h3>
                </div>
            </div>
        </div>
    </main>

    <script src="../js/generate-prefill-path.js"></script>
    <script src="../js/sys.js"></script>
</body>

</html>
