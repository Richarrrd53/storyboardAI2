<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>生成分鏡 — Storyboard AI</title>
    <link rel="stylesheet" href="../css/style.css" />
    <link rel="stylesheet" href="../css/generate.css" />
    <link rel="stylesheet" href="../css/math-curve-loader.css" />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;500&family=DM+Mono:wght@400&display=swap" rel="stylesheet">
</head>

<body>
    <main id="page-main" class="gen-main">
        <div class="generate-workspace" id="generate-workspace">
            
            <!-- ════════════════════════════════════════════════════
                 頂部輕量進度導航列 (Spec item 20)
            ════════════════════════════════════════════════════ -->
            <header class="workspace-top-bar" id="workspace-top-bar">
                <div class="workspace-brand">
                    <span class="brand-sparkle">✦</span>
                    <span class="brand-title">Storyboard AI</span>
                </div>
                
                <nav class="workspace-stage-nav" id="workspace-stage-nav" aria-label="創作流程進度">
                    <span class="stage-step active" id="step-nav-1" data-phase="1">想法</span>
                    <span class="stage-sep">―</span>
                    <span class="stage-step" id="step-nav-2" data-phase="2">創作方向</span>
                    <span class="stage-sep">―</span>
                    <span class="stage-step" id="step-nav-3" data-phase="3">模板</span>
                    <span class="stage-sep">―</span>
                    <span class="stage-step" id="step-nav-4" data-phase="4">生成</span>
                </nav>
                
                <div class="workspace-progress-indicator">
                    <span class="phase-count-badge" id="phase-count-badge">1 / 4</span>
                </div>
            </header>

            <!-- ════════════════════════════════════════════════════
                 Persistent Creation Surface (Spec items 5, 7, 8, 9, 10, 44)
            ════════════════════════════════════════════════════ -->
            <section class="creation-surface" id="creation-surface" data-phase="1">
                
                <!-- ════════════════════════════════════════════════════
                     Persistent Story Context Header (從 Phase 2 開始固定在頂部)
                     Spec items 8, 10, 16, 18
                ════════════════════════════════════════════════════ -->
                <div class="story-context-header" id="story-context-header">
                    <div class="context-pill context-story-pill" id="context-story-pill">
                        <span class="context-icon">✦</span>
                        <span class="context-story-text" id="context-story-text"></span>
                        <span class="context-check">✓</span>
                        <button type="button" class="context-edit-btn" id="context-edit-btn" title="修改故事" aria-label="修改故事" onclick="editStoryFromHeader()">✎</button>
                    </div>
                    
                    <div class="context-pill context-meta-pill" id="context-meta-pill" style="display: none;">
                        <span class="context-meta-text" id="context-meta-text"></span>
                    </div>
                    
                    <div class="context-pill context-template-pill" id="context-template-pill" style="display: none;">
                        <span class="context-template-text" id="context-template-text"></span>
                    </div>
                </div>

                <!-- ════════════════════════════════════════════════════
                     Phase 1 — Idea (輸入故事)
                     Spec items 6, 7, 8, 9
                ════════════════════════════════════════════════════ -->
                <div class="phase-panel phase-1-panel active" id="phase-panel-1">
                    <div class="phase-hero-headline" id="phase1-headline">
                        <h1 class="hero-title">建立新的分鏡</h1>
                        <p class="hero-subtitle">從一個想法開始，描述你的故事或靈感</p>
                    </div>

                    <!-- 靈感推薦晶片 -->
                    <div class="suggestion-row" id="phase1-suggestions">
                        <span class="sugg-label">靈感推薦：</span>
                        <div class="sugg-chips-list">
                            <button type="button" class="sugg-chip" onclick="fillPhase1Sugg(this)">蘋果牛奶廣告</button>
                            <button type="button" class="sugg-chip" onclick="fillPhase1Sugg(this)">旅遊短影音</button>
                            <button type="button" class="sugg-chip" onclick="fillPhase1Sugg(this)">美食餐廳探店介紹</button>
                            <button type="button" class="sugg-chip" onclick="fillPhase1Sugg(this)">運動服品牌形象</button>
                            <button type="button" class="sugg-chip" onclick="fillPhase1Sugg(this)">科技產品發表預告</button>
                        </div>
                    </div>

                    <!-- 主 Composer 容器 -->
                    <div class="composer-container" id="phase1-composer">
                        <textarea id="story-input" class="story-composer-textarea" placeholder="描述故事或創作方向... ✦" rows="1" oninput="onStoryInput()"></textarea>
                        <button type="button" class="composer-submit-btn" id="composer-submit-btn" disabled aria-label="送出故事" onclick="submitPhase1Story()">
                            <div class="btn-icon-wrapper">
                                <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
                                    <path d="M14.2199 21.63C13.0399 21.63 11.3699 20.8 10.0499 16.83L9.32988 14.67L7.16988 13.95C3.20988 12.63 2.37988 10.96 2.37988 9.78001C2.37988 8.61001 3.20988 6.93001 7.16988 5.60001L15.6599 2.77001C17.7799 2.06001 19.5499 2.27001 20.6399 3.35001C21.7299 4.43001 21.9399 6.21001 21.2299 8.33001L18.3999 16.82C17.0699 20.8 15.3999 21.63 14.2199 21.63Z" fill="currentColor"></path>
                                </svg>
                            </div>
                        </button>
                    </div>
                </div>

                <!-- ════════════════════════════════════════════════════
                     Phase 2 — Direction (創作方向)
                     Spec items 11, 12, 13
                ════════════════════════════════════════════════════ -->
                <div class="phase-panel phase-2-panel" id="phase-panel-2">
                    <div class="direction-header">
                        <div class="direction-badge-wrap">
                            <span class="direction-title-badge">✦ 創作方向</span>
                        </div>
                        <!-- AI 推薦文字 (打字機效果) -->
                        <div class="direction-ai-box" id="direction-ai-box">
                            <span class="ai-box-sparkle">✦</span>
                            <span class="ai-box-text" id="direction-ai-text">AI 正在為故事分析最佳視覺調性與畫面比例...</span>
                            <span class="ai-box-cursor" id="direction-ai-cursor">|</span>
                        </div>
                    </div>

                    <!-- 視覺風格區塊 -->
                    <div class="direction-section" id="section-visual-style">
                        <div class="section-label-row">
                            <label class="section-label">視覺風格</label>
                            <span class="section-hint">選擇最能襯托故事氛圍的影像調性</span>
                        </div>
                        <div class="style-cards-wrap" id="style-cards-grid"></div>
                    </div>

                    <!-- 畫面比例區塊 -->
                    <div class="direction-section" id="section-aspect-ratio">
                        <div class="section-label-row">
                            <label class="section-label">畫面比例</label>
                            <span class="section-hint">依發布平台選擇最佳影音畫幅</span>
                        </div>
                        <div class="ratio-chips-wrap" id="ratio-chips-grid">
                            <button type="button" class="ratio-chip" data-ratio="直向9:16" onclick="selectRatioOption(this)">
                                <span class="ratio-icon ratio-icon-9-16"></span>
                                <span class="ratio-text-num">9:16</span>
                                <span class="ratio-text-sub">Shorts / Reels</span>
                            </button>
                            <button type="button" class="ratio-chip active" data-ratio="橫向16:9" onclick="selectRatioOption(this)">
                                <span class="ratio-icon ratio-icon-16-9"></span>
                                <span class="ratio-text-num">16:9</span>
                                <span class="ratio-text-sub">YouTube / 橫向</span>
                            </button>
                            <button type="button" class="ratio-chip" data-ratio="1:1" onclick="selectRatioOption(this)">
                                <span class="ratio-icon ratio-icon-1-1"></span>
                                <span class="ratio-text-num">1:1</span>
                                <span class="ratio-text-sub">IG 方形</span>
                            </button>
                            <button type="button" class="ratio-chip" data-ratio="橫向3:2" onclick="selectRatioOption(this)">
                                <span class="ratio-icon ratio-icon-3-2"></span>
                                <span class="ratio-text-num">3:2</span>
                                <span class="ratio-text-sub">經典底片</span>
                            </button>
                            <button type="button" class="ratio-chip" data-ratio="直向2:3" onclick="selectRatioOption(this)">
                                <span class="ratio-icon ratio-icon-2-3"></span>
                                <span class="ratio-text-num">2:3</span>
                                <span class="ratio-text-sub">直式海報</span>
                            </button>
                        </div>
                    </div>

                    <!-- 動作按鈕 -->
                    <div class="phase-actions-footer">
                        <button type="button" class="btn btn-ghost" id="btn-direction-back" onclick="switchPhase(1)">← 重新描述故事</button>
                        <button type="button" class="btn btn-primary" id="btn-direction-next" onclick="confirmDirectionAndAdvance()">下一步：選擇模板 →</button>
                    </div>
                </div>

                <!-- ════════════════════════════════════════════════════
                     Phase 3 — Template (選擇模板)
                     Spec items 14, 15, 16, 17
                ════════════════════════════════════════════════════ -->
                <div class="phase-panel phase-3-panel" id="phase-panel-3">
                    <div class="template-header">
                        <div class="template-header-left">
                            <h2 class="template-title">✦ 選擇模板</h2>
                            <p class="template-subtitle">套用爆款節奏結構，或跳過模板直接以自由結構生成</p>
                        </div>
                        <div class="template-header-right">
                            <button type="button" class="btn btn-outline btn-sm" id="btn-skip-template" onclick="skipTemplateAndGenerate()">
                                跳過模板（自由結構） ➔
                            </button>
                        </div>
                    </div>

                    <!-- AI 推薦提示橫條 -->
                    <div class="template-recommend-bar" id="template-recommend-bar">
                        <span class="rec-sparkle">✦</span>
                        <span class="rec-title" id="template-rec-text">AI 已為你的故事配對最佳模板</span>
                    </div>

                    <!-- 模板分類標籤與卡片庫 -->
                    <div class="template-browser-wrap">
                        <div class="template-category-chips" id="template-category-chips"></div>
                        <div class="template-cards-container" id="template-cards-container"></div>
                    </div>

                    <!-- 動作按鈕 -->
                    <div class="phase-actions-footer template-actions-footer">
                        <button type="button" class="btn btn-ghost" id="btn-template-back" onclick="switchPhase(2)">← 返回創作方向</button>
                        <button type="button" class="btn btn-primary" id="btn-template-confirm" onclick="applySelectedTemplateAndGenerate()" disabled>
                            ✦ 套用模板並開始生成 →
                        </button>
                    </div>
                </div>

                <!-- ════════════════════════════════════════════════════
                     Phase 4 — Generate (分析、規劃、提示詞、沖洗)
                     Spec items 18, 19
                ════════════════════════════════════════════════════ -->
                <div class="phase-panel phase-4-panel" id="phase-panel-4">
                    <!-- 生成進行中狀態 -->
                    <div class="generation-progress-wrap" id="generation-progress-wrap">
                        <div class="math-loader-box">
                            <svg class="loader math-loader-svg" viewBox="0 0 100 100" fill="none" aria-hidden="true">
                                <g class="math-loader-group">
                                    <path class="math-loader-path" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" opacity="0.1"></path>
                                </g>
                                <g class="math-loader-sucked"></g>
                            </svg>
                        </div>

                        <div class="gen-progress-bar-wrap">
                            <div class="gen-progress-track">
                                <div class="gen-progress-fill" id="gen-progress-fill"></div>
                            </div>
                            <div class="gen-progress-meta">
                                <span class="gen-status-text" id="gen-status-text">正在規劃腳本結構...</span>
                                <span class="gen-status-pct" id="gen-status-pct">0%</span>
                            </div>
                        </div>

                        <!-- 4 步驟狀態機 -->
                        <div class="gen-timeline" id="gen-timeline">
                            <div class="gen-step" id="step-analyze" data-status="pending">
                                <div class="step-indicator"><div class="step-dot"></div></div>
                                <div class="step-body">
                                    <div class="step-title">解析故事靈感</div>
                                    <div class="step-desc">分析文本結構與核心主旨</div>
                                </div>
                            </div>
                            <div class="gen-step" id="step-structure" data-status="pending">
                                <div class="step-indicator"><div class="step-dot"></div></div>
                                <div class="step-body">
                                    <div class="step-title">編排鏡頭結構</div>
                                    <div class="step-desc">規劃鏡位、視角與時間軸</div>
                                </div>
                            </div>
                            <div class="gen-step" id="step-prompt" data-status="pending">
                                <div class="step-indicator"><div class="step-dot"></div></div>
                                <div class="step-body">
                                    <div class="step-title">繪製分鏡草稿</div>
                                    <div class="step-desc">注入視覺風格與提示詞設計</div>
                                </div>
                            </div>
                            <div class="gen-step" id="step-render" data-status="pending">
                                <div class="step-indicator"><div class="step-dot"></div></div>
                                <div class="step-body">
                                    <div class="step-title">沖洗電影膠捲</div>
                                    <div class="step-desc">影像優化與分鏡成型</div>
                                </div>
                            </div>
                        </div>

                        <div class="gen-abort-row">
                            <button type="button" class="btn btn-ghost btn-sm" id="btn-abort-generation" onclick="abortGeneration()">■ 中斷生成</button>
                        </div>
                    </div>

                    <!-- 生成完成結果展示 -->
                    <div class="generation-result-wrap" id="generation-result-wrap" style="display: none;">
                        <div class="result-header">
                            <div class="result-info">
                                <h2 class="result-title">分鏡草稿已就緒 ✦</h2>
                                <p class="result-meta" id="result-meta-info"></p>
                            </div>
                            <div class="result-actions">
                                <button type="button" class="btn btn-outline btn-sm" onclick="exportStoryboardJson()">↓ 匯出 JSON</button>
                                <button type="button" class="btn btn-primary btn-sm" onclick="resetCreationWorkflow()">+ 新建分鏡</button>
                            </div>
                        </div>
                        <div class="storyboard-grid" id="storyboard-grid"></div>
                    </div>
                </div>

            </section>
        </div>
    </main>

    <!-- ══════════════════════════════════
        SCRIPTS
    ══════════════════════════════════ -->
    <script src="../js/math-curve-loader.js"></script>
    <script src="../js/token-manager.js"></script>
    <script src="../js/prompt-translate.js"></script>
    <script src="../js/generate.js"></script>
    <script src="../js/sys.js"></script>
</body>

</html>
