<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>熱門短影音搜尋與分析</title>
    <link rel="stylesheet" href="../css/discovery.css" />
</head>
<body>
    <main class="discovery-shell">
        <header class="discovery-header">
            <a class="back-link" href="/dashboard">← 回到工作台</a>
            <p class="eyebrow">STORYBOARD AI / DISCOVERY</p>
            <h1>熱門短影音搜尋與自動分析</h1>
            <p class="intro">輸入頻道名稱或 #hashtag，選擇平台、SKILL、時間與數量，即可搜尋真實影片並逐支分析畫面與語音。</p>
        </header>

        <section class="search-panel" aria-labelledby="search-title">
            <div class="panel-heading">
                <div><span class="step">01</span><h2 id="search-title">設定搜尋條件</h2></div>
                <a id="skill-status" class="status-chip settings-link" href="/discovery/settings" aria-label="前往 API 設定">檢查連線設定…</a>
            </div>
            <form id="discovery-form">
                <label class="field field-wide">頻道名稱或 #hashtag
                    <input id="query" name="query" type="search" placeholder="頻道名稱、@帳號或 #料理" autocomplete="off" required maxlength="120" aria-describedby="search-help" />
                </label>
                <label class="field">Platform
                    <select id="platform" name="platform">
                        <option value="youtube-shorts">YouTube Shorts</option>
                        <option value="tiktok" disabled>TikTok（尚未串接）</option>
                        <option value="instagram-reels" disabled>Instagram Reels（尚未串接）</option>
                    </select>
                </label>
                <label class="field">SKILL
                    <select id="skill" name="skill"></select>
                </label>
                <label class="field">發布時間
                    <select id="timeRange" name="timeRange">
                        <option value="7">最近 7 天</option>
                        <option value="30" selected>最近 30 天</option>
                        <option value="90">最近 90 天</option>
                        <option value="all">不限時間</option>
                    </select>
                </label>
                <label class="field">影片數量
                    <input id="resultLimit" name="resultLimit" type="number" min="1" max="20" value="5" required step="1" />
                </label>
                <button class="search-button" type="submit" disabled><span>搜尋並分析</span><span aria-hidden="true">↗</span></button>
            </form>
            <p id="search-help" class="search-help">以 # 開頭搜尋 hashtag，其餘搜尋頻道；同名頻道建議使用 @帳號。依觀看數排序，分析最多 20 支、每支 180 秒內的公開影片。</p>
            <p id="form-message" class="form-message" role="status"></p>
        </section>

        <section class="results-section" aria-labelledby="results-title">
            <div class="results-heading"><div><span class="step">02</span><h2 id="results-title">候選影片</h2></div><span id="result-count" class="result-count">尚未搜尋</span></div>
            <div id="results" class="results-list" aria-live="polite"><div class="empty-state"><strong>等待你的搜尋條件</strong><span>搜尋後會顯示來源影片、觀看數與附有時間戳的 AI 結構分析。</span></div></div>
        </section>
    </main>
    <script src="../js/discovery.js"></script>
</body>
</html>
