<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><title>StoryboardAI Phase 4 Folder QA</title>
<style>body{margin:16px;background:#e2e8f0;font:14px sans-serif}header{display:flex;gap:8px;margin-bottom:12px;align-items:center;flex-wrap:wrap}button{padding:10px 14px}iframe{border:0;background:white;display:block}pre{white-space:pre-wrap}a{padding:8px}</style>
<header><strong id="size"></strong><button id="matrix">準備長名／空封面隔離資料</button><button id="folder-check">比較三頁 Folder 幾何</button><button id="delete-preview">刪除預覽與動態記錄</button><button id="workspace">登入隔離帳戶並開啟工作區</button><button id="history-check">檢查 Panel → History SPA</button><button id="dialog">重新命名 Prompt</button><button id="logout">登出確認</button><button id="qc">Quick Create</button><button id="menu">專案選單</button><button id="fallback">Opaque fallback</button><a href="/phase1-harness">回驗證台</a></header><p id="status" role="status">Ready</p><iframe id="product" title="指定 CSS viewport 的正式 SPA"></iframe><pre id="report"></pre>
<script>
const params=new URLSearchParams(location.search);const requestedWidth=Number(params.get('width'));const width=[375,390,768,1024,1440,1920].includes(requestedWidth)?requestedWidth:390;const height=width===1920?1080:width>=1024?900:width===768?1024:width===375?812:844;
const product=document.getElementById('product');product.style.width=width+'px';product.style.height=height+'px';document.getElementById('size').textContent=width+' × '+height+' CSS px';
const status=document.getElementById('status'),report=document.getElementById('report');let loadCount=0,ready=false;
const delay=ms=>new Promise(r=>setTimeout(r,ms));
async function until(fn){const start=Date.now();while(!fn()){if(Date.now()-start>12000)throw new Error('等待 SPA 就緒逾時');await delay(50);}}
const app=()=>product.contentDocument?.querySelector('#ifm')?.contentWindow;
function wire(id,fn){document.getElementById(id).onclick=async()=>{try{status.textContent='執行中';await fn();status.textContent='完成';}catch(error){status.textContent=error.message;report.textContent=error.stack;}};}
wire('workspace',async()=>{
 const health=await fetch('/audit-health').then(r=>r.json());if(!health.isolated)throw new Error('需要隔離服務');
 const auth=await fetch('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:'fixture@example.test',password:'fixture-only'})}).then(r=>r.json());localStorage.setItem('spa_auth_token',auth.token);
 await fetch('/phase1-control',{method:'POST',body:JSON.stringify({deleted:false})});
 product.src='/dashboard';await until(()=>app()?.document.querySelector('#mob-nav-profile')&&app()?.document.querySelector('.project-option-btn'));
 product.contentDocument.querySelector('#ifm').addEventListener('load',()=>{loadCount++;});ready=true;
 report.textContent=JSON.stringify({ready,width,height,innerDocumentLoadsAfterMount:loadCount});
});
wire('history-check',async()=>{
 if(!ready)throw new Error('請先開啟工作區');const w=app();const doc=w.document;
 const trigger=width<=768?doc.querySelector('#mob-nav-profile'):doc.querySelector('#top-avatar');trigger.click();await delay(450);
 doc.querySelector('#up-recycle-bin').click();await until(()=>w.spaRouter.currentPage==='history');await delay(650);
 const nav=doc.querySelector('#spa-mobile-nav');const result={case:'Panel to History',route:w.spaRouter.currentPage,innerDocumentLoadsAfterMount:loadCount,bottomNavHidden:nav.hidden,navInert:nav.inert,navAriaHidden:nav.getAttribute('aria-hidden')};
 result.passed=loadCount===0&&nav.hidden&&nav.inert;report.textContent=JSON.stringify(result,null,2);
 await fetch('/phase4-results',{method:'POST',body:JSON.stringify(result)});
});
wire('dialog',async()=>{if(!ready)throw new Error('請先開啟工作區');const w=app();w.ProjectActions.renameProject(w.ProjectStore.getProjects().find(p=>!p.is_deleted));});
wire('logout',async()=>{if(!ready)throw new Error('請先開啟工作區');const w=app(),d=w.document;d.querySelector(width<=768?'#mob-nav-profile':'#top-avatar').click();await delay(450);d.querySelector('.up-logout').click();});
wire('qc',async()=>{if(!ready)throw new Error('請先開啟工作區');app().document.querySelector('#global-create-trigger').click();});
wire('menu',async()=>{if(!ready)throw new Error('請先開啟工作區');app().document.querySelector('.project-option-btn').click();});
wire('fallback',async()=>{if(!ready)throw new Error('請先開啟工作區');app().document.documentElement.toggleAttribute('data-opaque-surfaces');});

wire('matrix',async()=>{await fetch('/phase4-control',{method:'POST'});if(ready){const w=app();await w.ProjectStore.fetchProjects({force:true});w.ProjectStore.notify({type:'fixture'});}report.textContent='已準備三個隔離專案：9:16、1:1 長名、無封面。';});
wire('folder-check',async()=>{
 if(!ready)throw new Error('請先開啟工作區');const w=app(),rows=[];
 for(const page of ['dashboard','projects','history']){
  await w.spaNavigate(page);await delay(750);
  const card=w.document.querySelector('.project-folder-card');
  rows.push({page,hovered:card?.matches(':hover'),expanded:card?.classList.contains('is-expanded'),geometry:card?w.ProjectCard.captureGeometry(card):null});
 }
 const result={case:'Phase 4 same viewport',width,viewport:w.document.documentElement.clientWidth,rows};report.textContent=JSON.stringify(result,null,2);await fetch('/phase4-results',{method:'POST',body:JSON.stringify(result)});
});
wire('delete-preview',async()=>{
 if(!ready)throw new Error('請先開啟工作區');const w=app(),doc=w.document;
 const source=doc.querySelector('.project-folder-card');if(!source)throw new Error('目前頁面沒有可測試卡片');
 const project=w.ProjectStore.getProjects().find(p=>String(p.id)===String(source.dataset.id));
 void w.ProjectActions.deleteProject(project,source);await until(()=>doc.querySelector('.sys-window'));
 const preview=doc.querySelector('.sys-preview .project-folder-card');
 const before=w.ProjectCard.captureGeometry(preview);const records=[];
 doc.querySelector('.sys-btn.primary').addEventListener('click',()=>{
  const start=w.performance.now();let next=0;
  function record(time){const elapsed=time-start;
   if(elapsed>=next){const bin=doc.querySelector('.sys-delete-trashbin');records.push({ms:Math.round(elapsed),transform:preview.style.transform,opacity:preview.style.opacity,bin:bin?.style.transform});next+=200;}
   if(elapsed<1100)w.requestAnimationFrame(record);else{const result={case:'Phase 4 live trash trace',before,records};report.textContent=JSON.stringify(result,null,2);fetch('/phase4-results',{method:'POST',body:JSON.stringify(result)});}
  }w.requestAnimationFrame(record);
 },{once:true});report.textContent='刪除預覽已開啟。請在真正的彈窗確認或取消；所有資料為記憶體 mock。';
});
</script></html>
