<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><title>Phase 7 全站 QA 隔離台</title><style>body{margin:16px;font:14px system-ui;background:#e2e8f0;color:#0f172a}header{display:flex;flex-wrap:wrap;gap:8px;align-items:center}button,select{padding:10px}iframe{display:block;border:0;background:white;margin-top:12px}pre{white-space:pre-wrap;max-width:1000px}.capture{margin:0}.capture>header,.capture>p,.capture>pre{display:none}</style></head><body>
<header><strong>Phase 7｜隔離資料</strong><select id="width" aria-label="測試寬度"><option>375</option><option selected>390</option><option>768</option><option>1024</option><option>1440</option><option>1920</option></select><select id="page" aria-label="頁面"><option value="landing">Landing</option><option value="login">Login</option><option value="register">Register</option><option value="dashboard" selected>Dashboard</option><option value="projects">Projects</option><option value="project">Project Detail</option><option value="generate">Generate</option><option value="template">Template Library</option><option value="template-detail">Template Detail</option><option value="history">History</option><option value="discovery">Discovery</option><option value="discovery-settings">Discovery Settings</option></select><button id="open">準備隔離頁面</button><button id="measure">量測目前狀態</button><button id="scan">72 個首屏技術檢查</button><button id="choices">Generate 方向控制項</button><button id="dialog">中央彈窗開關記錄</button><button id="opaque">切換不透明模式</button><button id="capture">截圖模式</button><a href="/phase6-harness?width=390">Phase6 動態矩陣</a><a href="/discovery-harness?width=390">Discovery 錯誤／返回矩陣</a></header>
<p id="status" role="status">本輪瀏覽器尚未執行；此入口為準備好的 QA 工具。幾何檢查不是視覺驗收，不會按生成、註冊、刪除或永久清空。</p><iframe id="product" title="正式 Vanilla SPA，僅使用本地記憶體資料"></iframe><pre id="report"></pre>
<script>
const routes={landing:'main.html',login:'login',register:'register',dashboard:'dashboard',projects:'projects',project:'project/audit-folder',generate:'generate',template:'template','template-detail':'template/phase7-long',history:'history',discovery:'discovery','discovery-settings':'discovery/settings'};
const frame=document.getElementById('product'),report=document.getElementById('report'),status=document.getElementById('status'),widthInput=document.getElementById('width'),pageInput=document.getElementById('page');
const params=new URLSearchParams(location.search);if([...widthInput.options].some(o=>o.value===params.get('width')))widthInput.value=params.get('width');
const app=()=>frame.contentDocument?.querySelector('#ifm')?.contentWindow;const delay=ms=>new Promise(r=>setTimeout(r,ms));
async function until(predicate){const start=Date.now();while(!predicate()){if(Date.now()-start>15000)throw new Error('頁面準備逾時');await delay(60);}}
function size(){const width=Number(widthInput.value);frame.style.width=width+'px';frame.style.height=(width===1920?1080:width>=1024?900:width===768?1024:width===375?812:844)+'px';}
widthInput.onchange=size;size();
async function fixture(page){const health=await fetch('/audit-health').then(r=>r.json());if(!health.isolated)throw new Error('需要隔離服務');
 await fetch('/phase1-control',{method:'POST',body:JSON.stringify({deleted:page==='history'})});
 await fetch('/phase5-templates-control',{method:'POST',body:JSON.stringify([{id:'phase7-long',name:'咖啡片頭 #品牌 https://example.test/promotion',category:'story',tags:['隔離測試','品牌'],thumbnail:'/audit-cover.svg',source:{title:'原始影片 #品牌',description:'晨光與咖啡。\n'+ '保留來源原文與超長連結。'.repeat(80)+' https://example.test/promotion #咖啡'},structure:[{id:'shot-one',title:'晨光',duration:'3s'}]},{id:'phase7-unknown',name:'未提供規格的隔離模板',category:'custom'}])});
 if(['landing','login','register'].includes(page))localStorage.removeItem('spa_auth_token');else{const auth=await fetch('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:'fixture@example.test',password:'fixture-only'})}).then(r=>r.json());localStorage.setItem('spa_auth_token',auth.token);}
}
async function open(page=pageInput.value){size();await fixture(page);frame.src='/'+routes[page];await until(()=>app()?.document.querySelector('#page-main'));await until(()=>app()?.spaRouter?.currentPage===(page==='template-detail'?'template':page==='landing'?'landing':page));await delay(600);return measure(page);}
function rect(node){if(!node)return null;const r=node.getBoundingClientRect();return{left:r.left,top:r.top,right:r.right,bottom:r.bottom,width:r.width,height:r.height};}
function measure(page=pageInput.value){const w=app(),d=w?.document;if(!d)throw new Error('請先準備頁面');const main=d.querySelector('#page-main');return{kind:'DOM geometry only; not visual acceptance',page,route:w.spaRouter?.currentPage,url:frame.contentWindow.location.pathname,requestedWidth:Number(widthInput.value),actualWidth:d.documentElement.clientWidth,viewportHeight:w.innerHeight,outerOverflow:d.documentElement.scrollWidth>d.documentElement.clientWidth+1,main:rect(main),scrollOwners:[...d.querySelectorAll('.content-body,.page-scroll')].map(n=>({class:n.className,rect:rect(n),overflow:n.scrollWidth>n.clientWidth+1,scrollTop:n.scrollTop,maxScroll:n.scrollHeight-n.clientHeight,mask:w.getComputedStyle(n).maskImage})),dialogs:d.querySelectorAll('[role=dialog],[role=alertdialog]').length,images:[...d.querySelectorAll('img')].filter(n=>n.getClientRects().length&&n.complete&&n.naturalWidth===0).map(n=>n.getAttribute('alt')),controls:[...d.querySelectorAll('button,input,select,textarea,a[href]')].filter(n=>n.getClientRects().length).length,labels:[...d.querySelectorAll('label')].map(n=>({for:n.htmlFor,text:n.textContent.trim()}))};}
function wire(id,action){document.getElementById(id).onclick=async()=>{status.textContent='執行中';try{const result=await action();if(result)report.textContent=JSON.stringify(result,null,2);status.textContent='操作完成；仍需目視、鍵盤與狀態驗收。';}catch(error){status.textContent=error.message;report.textContent=error.stack;}};}
wire('open',()=>open());wire('measure',()=>measure());
wire('scan',async()=>{const rows=[];for(const width of [375,390,768,1024,1440,1920]){widthInput.value=String(width);for(const page of Object.keys(routes)){pageInput.value=page;rows.push(await open(page));report.textContent=JSON.stringify({state:'running',rows},null,2);}}return{kind:'72 initial-state DOM checks; not 504-state visual acceptance',rows};});
wire('choices',async()=>{await open('generate');const w=app();w.CreationSessionStore.reset({force:true});w.CreationSessionStore.creativeBrief=w.CreativeBrief.create('');w.CreationSessionStore.duration=42;w.switchPhase(2,false);return measure('generate-direction');});
wire('opaque',()=>{app().document.documentElement.toggleAttribute('data-opaque-surfaces');return measure();});
wire('capture',()=>document.body.classList.add('capture'));
wire('dialog',async()=>{const w=app();if(!w?.DialogService)throw new Error('先準備工作區');const rows=[];for(const kind of ['prompt','confirm','alert']){const done=w.DialogService[kind]({title:'隔離 '+kind,value:'QA'});const panel=w.document.querySelector('.sb-dialog'),overlay=panel.parentElement;const enterFrames=[];const enterStart=w.performance.now();await new Promise(resolve=>{function tick(now){enterFrames.push({ms:now-enterStart,scale:w.getComputedStyle(panel).scale});if(now-enterStart<500)w.requestAnimationFrame(tick);else resolve();}w.requestAnimationFrame(tick);});const frames=[];const entry=w.getComputedStyle(panel).scale;const cancel=panel.querySelector('.sb-dialog-cancel')||panel.querySelector('.sb-dialog-submit');cancel.click();const start=w.performance.now();await new Promise(resolve=>{function tick(now){const c=w.getComputedStyle(panel);frames.push({ms:now-start,scale:c.scale,connected:panel.isConnected});if(now-start<550)w.requestAnimationFrame(tick);else resolve();}w.requestAnimationFrame(tick);});await done;rows.push({kind,entry,enterFrames,hasIntermediateEnterFrame:enterFrames.some(f=>Number(f.scale)>0&&Number(f.scale)<.9),frames,exitTarget:panel.style.scale,scrimOpacity:overlay.style.opacity,hasIntermediateExitFrame:frames.some(f=>Number(f.scale)>0&&Number(f.scale)<.9)});}return{kind:'Animation sampling; dropped frames remain inconclusive',rows};});
</script></body></html>
