<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>StoryboardAI UI 隔離驗證台</title><link rel="stylesheet" href="/css/style.css">
<style>body{background:var(--canvas);color:var(--text-primary);font-family:var(--font-family-body);padding:24px}main{max-width:960px;margin:auto}h1{font-size:24px;margin-bottom:12px}button,a{margin:6px;padding:10px 16px;min-height:44px}pre{white-space:pre-wrap;overflow-wrap:anywhere;padding:16px;background:var(--color-bg-subtle);border-radius:16px}section{margin:24px 0}</style>
<main><h1>StoryboardAI UI 隔離驗證台</h1><p>本頁只操作記憶體測試專案，不連接正式資料庫。請以 <code>npm run audit:ui</code> 啟動，不能直接以 file:// 開啟。</p>
<p id="health" role="status">正在檢查測試服務…</p>
<section aria-label="對話框測試"><button id="alert" disabled>Alert</button><button id="confirm" disabled>Confirm</button><button id="prompt" disabled>專案重新命名</button><button id="restore" disabled>復原一次確認</button><button id="logout" disabled>登出確認</button><button id="queue" disabled>連續 Dialog</button><button id="abort" disabled>開啟後 Abort</button><button id="ime" disabled>IME Enter 檢查</button><button id="checks" disabled>執行隔離回歸</button></section>
<section aria-label="測試資料"><button id="reset" disabled>重設一般專案</button><button id="deleted" disabled>準備回收桶資料</button><button id="rename-fail" disabled>名稱第一次儲存失敗</button><button id="restore-fail" disabled>復原第一次失敗</button><button id="delay" disabled>名稱儲存延遲兩秒</button><a href="/login">進入正式 SPA Mock</a><a href="/phase1-harness?reduced=1">Reduced Motion 分支</a><a href="/phase2-visual?width=390">手機 390 驗證</a><a href="/phase2-visual?width=1440">桌面 1440 驗證</a></section>
<pre id="report" aria-live="polite">尚未執行操作</pre></main>
<script>window.spaAuth={getToken:()=> 'isolated-audit-fixture'};if(new URLSearchParams(location.search).has('reduced')){const original=window.matchMedia.bind(window);window.matchMedia=query=>query.includes('prefers-reduced-motion')?{matches:true,addEventListener(){}}:original(query);}</script>
<script src="/js/features/projects.js"></script><script src="/js/sys.js"></script><script src="/phase1-harness.js"></script></html>
