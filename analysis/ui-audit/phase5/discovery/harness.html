<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><title>Discovery SPA QA</title>
<style>body{margin:16px;background:#e2e8f0;font:14px sans-serif}header{display:flex;gap:8px;flex-wrap:wrap;align-items:center}button{padding:10px}iframe{display:block;border:0;background:white}pre{white-space:pre-wrap}.capture{margin:0}.capture>header,.capture>#status,.capture>#report{display:none}</style>
<header><strong id="size"></strong><button id="discovery">開啟隔離 Discovery</button><button id="settings">設定頁直達</button><button id="states">讀取失敗／重試／離頁中斷</button><button id="flow">SPA 返回與狀態檢查</button><button id="capture">截圖模式</button></header><p id="status" role="status">Ready</p><iframe id="product" title="Discovery 正式元件隔離視窗"></iframe><pre id="report"></pre>
<script>
const requested=Number(new URLSearchParams(location.search).get('width'));const width=[375,390,768,1024,1440,1920].includes(requested)?requested:390,height=width>=1024?900:844;
const product=document.querySelector('#product'),report=document.querySelector('#report'),status=document.querySelector('#status');product.style.width=width+'px';product.style.height=height+'px';document.querySelector('#size').textContent=width+' CSS px';
let loads=0;product.addEventListener('load',()=>loads++);
const app=()=>product.contentDocument?.querySelector('#ifm')?.contentWindow||product.contentWindow;
const delay=ms=>new Promise(resolve=>setTimeout(resolve,ms));async function until(fn){const start=Date.now();while(!fn()){if(Date.now()-start>12000)throw new Error('等待正式元件逾時');await delay(30);}}
function wire(id,fn){document.querySelector('#'+id).onclick=async()=>{status.textContent='執行中';try{await fn();status.textContent='完成';}catch(error){status.textContent='失敗';report.textContent=error.stack;}};}
async function open(path){const health=await fetch('/audit-health').then(r=>r.json());if(!health.isolated)throw new Error('需要隔離服務');const auth=await fetch('/api/auth/login',{method:'POST'}).then(r=>r.json());localStorage.setItem('spa_auth_token',auth.token);product.src=path;await until(()=>app()?.document.querySelector(path.endsWith('settings')?'#api-settings-form':'#discovery-form'));}
wire('discovery',()=>open('/discovery'));wire('settings',()=>open('/discovery/settings'));wire('capture',async()=>{document.body.classList.add('capture');});

const control=options=>fetch('/discovery-control',{method:'POST',body:JSON.stringify(options)}).then(r=>r.json());
const inspect=label=>{const w=app(),d=w.document,main=d.querySelector('#page-main'),content=d.querySelector('#page-content'),wrapper=d.querySelector('.discovery-page-content');return{label,url:product.contentWindow.location.pathname,route:w.spaRouter?.currentPage,viewport:d.documentElement.clientWidth,shell:main?.className,legacyBrand:d.querySelectorAll('.discovery-brand').length,overflow:wrapper?wrapper.scrollWidth>wrapper.clientWidth+1:null,scrollOwner:content?w.getComputedStyle(content).overflowY:null,navHidden:d.querySelector('#spa-mobile-nav')?.hidden};};
wire('flow',async()=>{
 await control({configured:false,failLoad:false,failSave:false,delay:0});await open('/discovery');const w=app(),d=w.document,documentBefore=d,loadsBefore=loads,rows=[inspect('discovery')];let innerLoads=0;const child=product.contentDocument.querySelector('#ifm');child.addEventListener('load',()=>innerLoads++);
 await until(()=>d.querySelector('#discovery-form')?.dataset.discoveryInitialized==='true');d.querySelector('#skill-status').click();
 await until(()=>w.spaRouter.currentPage==='discovery-settings'&&!!d.querySelector('#key-fields')&&!d.querySelector('#key-fields').disabled&&!d.body.classList.contains('is-navigating'));rows.push(inspect('settings'));
 const neverRevealed=Array.from(d.querySelectorAll('#key-fields input')).every(input=>input.value===''&&input.type==='password');
 d.querySelector('#youtube-key').value='fixture-youtube-only';d.querySelector('#gemini-key').value='fixture-gemini-only';d.querySelector('#api-settings-form').dispatchEvent(new w.Event('input',{bubbles:true}));d.querySelector('#api-settings-form').requestSubmit();
 await until(()=>d.querySelector('#settings-message')?.classList.contains('is-success'));const cleared=Array.from(d.querySelectorAll('#key-fields input')).every(input=>input.value===''&&input.type==='password');
 d.querySelector('#return-search').click();await until(()=>w.spaRouter.currentPage==='discovery'&&d.querySelector('#discovery-form')?.dataset.discoveryInitialized==='true'&&!d.body.classList.contains('is-navigating'));rows.push(inspect('return'));
 await until(()=>!d.querySelector('#discovery-form button')?.disabled);d.querySelector('#query').value='#fixture';d.querySelector('#discovery-form').requestSubmit();await until(()=>d.querySelector('#results .empty-state strong')?.textContent==='沒有符合條件的影片');
 w.parent.history.back();await until(()=>w.spaRouter.currentPage==='discovery-settings'&&!!d.querySelector('#api-settings-form')&&!d.body.classList.contains('is-navigating'));rows.push(inspect('back'));
 w.parent.history.forward();await until(()=>w.spaRouter.currentPage==='discovery'&&!!d.querySelector('#discovery-form')&&!d.body.classList.contains('is-navigating'));rows.push(inspect('forward'));
 const result={width,rows,neverRevealed,cleared,outerReloads:loads-loadsBefore,innerReloads:innerLoads,sameDocument:app().document===documentBefore};result.passed=result.neverRevealed&&result.cleared&&result.outerReloads===0&&result.innerReloads===0&&result.sameDocument&&rows.every(row=>row.viewport===width&&!row.legacyBrand&&!row.overflow);report.textContent=JSON.stringify(result,null,2);
});
wire('states',async()=>{
 await control({configured:false,failLoad:false,failSave:false,delay:0});await open('/discovery');const w=app(),d=w.document;
 await control({failLoad:true});d.querySelector('#skill-status').click();await until(()=>d.querySelector('#retry-settings')?.hidden===false);
 const loadFailure={retryVisible:true,saveDisabled:d.querySelector('#save-settings').disabled,fieldsDisabled:d.querySelector('#key-fields').disabled};
 await control({failLoad:false});d.querySelector('#retry-settings').click();await until(()=>!d.querySelector('#key-fields').disabled);
 await control({failSave:true});d.querySelector('#youtube-key').value='fixture-youtube-only';d.querySelector('#gemini-key').value='fixture-gemini-only';d.querySelector('#api-settings-form').requestSubmit();await until(()=>d.querySelector('#settings-status').textContent==='尚未儲存成功');
 const saveFailure={retained:!!d.querySelector('#youtube-key').value,successHidden:d.querySelector('#return-search').hidden};
 d.querySelector('.back-link').click();await until(()=>w.spaRouter.currentPage==='discovery'&&!!d.querySelector('#skill-status'));
 await control({failSave:false,delay:500});d.querySelector('#skill-status').click();await until(()=>!!d.querySelector('#api-settings-form')?._settingsOwner);const oldForm=d.querySelector('#api-settings-form');oldForm.querySelector('#youtube-key').value='fixture-unsaved-only';d.querySelector('.back-link').click();await until(()=>w.spaRouter.currentPage==='discovery');await delay(650);
 const clearedOnLeave=!oldForm.querySelector('#youtube-key').value&&!oldForm._settingsOwner;await control({delay:0});const result={width,loadFailure,saveFailure,clearedOnLeave,passed:loadFailure.saveDisabled&&loadFailure.fieldsDisabled&&saveFailure.retained&&saveFailure.successHidden&&clearedOnLeave};report.textContent=JSON.stringify(result,null,2);
});
</script></html>
