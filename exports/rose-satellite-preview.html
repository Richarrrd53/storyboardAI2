<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>??????????</title><style>/* ============================================================
   STORYBOARD AI DESIGN SYSTEM v3.5
   Component: Project Folder Card (Storyboard Production Folder)
   File: public/css/components/project-card.css
   Spec: Project Folder Card 修正實作計畫 v0.2
   ============================================================ */

:root {
  --surface-folder: var(--color-surface-secondary, #F8F9FB);
  --surface-folder-highlight: #FFFFFF;
  --surface-folder-border: var(--color-border-subtle, rgba(203, 213, 225, 0.85));
  --surface-meta: var(--color-surface-tertiary, #F1F5F9);
  --folder-text-primary: var(--color-text-primary, #0F172A);
  --folder-text-secondary: var(--color-text-secondary, #64748B);
  --folder-shadow-default: 0 4px 16px rgba(15, 23, 42, 0.05), 0 1px 3px rgba(15, 23, 42, 0.03);
  --folder-shadow-hover: 0 12px 28px rgba(15, 23, 42, 0.09), 0 2px 8px rgba(15, 23, 42, 0.04);
}

/* ── 0. Base Container (.project-folder-card) ── */
.project-card.project-folder-card,
.project-folder-card {
  position: relative;
  width: 100%;
  max-width: 316px; /* 8% narrower: eliminates overly elongated ratio */
  margin: 0 auto;
  cursor: pointer;
  user-select: none;
  -webkit-user-select: none;
  display: flex;
  flex-direction: column;
  padding-top: var(--folder-headroom, 56px); /* Dedicated preview headroom (48px~72px) */
  box-sizing: border-box;
  background: transparent !important;
  border: none !important;
  box-shadow: none !important;
  overflow: visible !important;
  border-radius: 0 !important;
  transition: transform var(--motion-duration-fast, 200ms) var(--motion-ease-standard, cubic-bezier(.4, 0, .2, 1));
}

.project-folder-card:active {
  transform: scale(0.995);
}

.project-folder-card.is-navigating {
  pointer-events: none;
}

/* ── 1. Thin Rear Lip (Removed per v0.3 spec) ── */
.project-folder-rear-lip {
  display: none !important;
}

/* ── 2. Preview Activity Zone (.project-folder-preview-stack) ── */
.project-folder-preview-stack,
.project-preview-zone {
  position: relative;
  width: 100%;
  height: 140px;
  margin-bottom: -46px;
  z-index: 10;
  display: flex;
  justify-content: center;
  align-items: flex-end;
  overflow: visible !important;
  pointer-events: none;
}

/* Base sheet styles */
.project-preview-primary,
.project-preview-secondary {
  transform-origin: center bottom;
  box-sizing: border-box;
}

/* ── Fixed 16:9 Cover Frame (Unified Landscape Preview Frame) ── */
.project-folder-card .project-preview-primary,
.project-preview-primary,
.project-cover-frame {
  position: relative;
  width: var(--cover-width, var(--collapsed-width, 282px)) !important;
  height: var(--cover-height, var(--collapsed-height, 158.6px)) !important;
  aspect-ratio: 16 / 9 !important;
  max-width: 295px;
  max-height: 180px;
  border-radius: var(--radius-continuous-14);
  background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
  border: 1px solid rgba(255, 255, 255, 0.45);
  box-shadow: 0 6px 18px rgba(15, 23, 42, 0.10);
  overflow: hidden;
  z-index: 20;
  flex: none;
  transform-origin: bottom center;
  transform: translateY(calc(var(--insert-depth, var(--collapsed-insert-depth, 46px)) - 46px)) translateX(0) rotate(0deg) scale(1);
  transition: transform 320ms var(--motion-ease-standard, cubic-bezier(.4, 0, .2, 1)),
              border-radius 320ms var(--motion-ease-standard, cubic-bezier(.4, 0, .2, 1)),
              box-shadow 320ms var(--motion-ease-standard, cubic-bezier(.4, 0, .2, 1)),
              border-color 320ms var(--motion-ease-standard, cubic-bezier(.4, 0, .2, 1)),
              visibility 100ms ease;
  will-change: transform;
}

/* ── 2.1 Secondary Preview (Unified 16:9 Frosted White Glass Sheet - Spec v0.5) ── */
.project-preview-secondary {
  position: absolute;
  height: 128px;
  width: auto;
  aspect-ratio: 16 / 9;
  max-width: 244px;
  border-radius: var(--radius-continuous-14);
  background: rgba(255, 255, 255, 0.55);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border: 1px solid rgba(255, 255, 255, 0.55);
  box-shadow: 0 6px 18px rgba(10, 20, 40, 0.06);
  overflow: hidden;
  z-index: 10;
  transform-origin: 85% 90%;
  transform: translateY(24px) translateX(14px) rotate(5deg) scale(0.96);
  transition: transform var(--motion-duration-base, 300ms) var(--motion-ease-standard, cubic-bezier(.4, 0, .2, 1)),
              box-shadow var(--motion-duration-base, 300ms) var(--motion-ease-standard, cubic-bezier(.4, 0, .2, 1)),
              opacity var(--motion-duration-base, 300ms) var(--motion-ease-standard, cubic-bezier(.4, 0, .2, 1));
  opacity: 0.88;
  pointer-events: none;
}

/* ── 2.2 Primary Cover Ambient Overlay & Layers (Light White Frosted Material) ── */
.project-preview-primary.has-contain-preview {
  background: #ffffff !important;
  border-color: rgba(255, 255, 255, 0.65);
  box-shadow: 0 8px 24px rgba(15, 23, 42, 0.08);
}

.project-preview-primary::after {
  content: '';
  position: absolute;
  inset: 0;
  background: transparent;
  pointer-events: none;
  z-index: 1;
  opacity: 0;
  transition: opacity 0.35s ease;
}

.project-preview-primary.has-contain-preview::after {
  opacity: 1;
  background: linear-gradient(180deg, rgba(255, 255, 255, 0.58) 0%, rgba(248, 250, 252, 0.48) 100%);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
}

/* Contain Ambient Blurred Background Layer (Light White Frosted Material) */
.project-preview-primary-bg,
.project-preview-primary .cover-background {
  position: absolute;
  inset: -12px;
  width: calc(100% + 24px);
  height: calc(100% + 24px);
  object-fit: cover;
  object-position: center;
  filter: blur(24px) saturate(0.95) brightness(1.06);
  transform: scale(1.10);
  opacity: .42;
  pointer-events: none;
  border-radius: inherit;
  z-index: 0;
  transition: opacity 0.45s ease-in-out;
}

/* Foreground Main Cover Image */
.project-preview-primary-image,
.project-preview-primary .cover-main {
  position: relative;
  width: 100%;
  height: 100%;
  object-fit: contain;
  object-position: center;
  display: block;
  border-radius: inherit;
  z-index: 2;
  transition: opacity 0.35s ease-in-out;
}

.project-preview-primary.has-contain-preview .project-preview-primary-image,
.project-preview-primary.has-contain-preview .cover-main {
  filter: drop-shadow(0 4px 14px rgba(15, 23, 42, 0.10));
}

.project-preview-primary-image.fit-contain,
.project-preview-primary .cover-main.fit-contain {
  object-fit: contain;
}

.project-preview-primary-image.fit-cover,
.project-preview-primary .cover-main.fit-cover {
  object-fit: cover;
}

.project-preview-secondary img,
.project-preview-secondary .preview-secondary-inner {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
  filter: brightness(0.95);
}

.preview-secondary-sheet {
  width: 100%;
  height: 100%;
  background: linear-gradient(135deg, rgba(30, 41, 59, 0.85) 0%, rgba(15, 23, 42, 0.95) 100%);
  display: flex;
  align-items: center;
  justify-content: center;
  color: rgba(255, 255, 255, 0.4);
}

/* Fallback Frame (Draft Storyboard) */
.project-preview-primary .thumb-fallback {
  width: 100%;
  height: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
  color: var(--color-text-muted, #94a3b8);
  font-size: 0.75rem;
  font-family: var(--font-family-body, inherit);
  gap: 6px;
  user-select: none;
}

.project-preview-primary .fallback-clapper {
  color: rgba(255, 255, 255, 0.7);
  transition: transform 0.3s ease;
}

.project-preview-primary .fallback-status {
  font-size: 0.8rem;
  font-weight: 600;
  color: #f8fafc;
}

.project-preview-primary .fallback-sub {
  font-size: 0.72rem;
  color: #94a3b8;
}

/* ── 3. Front Folder Shell (Primary Folder Object) ── */
.project-folder-shell {
  position: relative;
  z-index: 30; /* Front layer covering the inserted sheets */
  display: flex;
  flex-direction: column;
  min-height: 136px;
  background: var(--surface-folder);
  border: 1px solid var(--surface-folder-border);
  border-radius: 0 var(--radius-lg) var(--radius-lg) var(--radius-lg);
  box-shadow: var(--folder-shadow-default);
  transition: transform 240ms var(--motion-ease-standard, cubic-bezier(.4, 0, .2, 1)),
              box-shadow 240ms var(--motion-ease-standard, cubic-bezier(.4, 0, .2, 1)),
              border-color 240ms var(--motion-ease-standard, cubic-bezier(.4, 0, .2, 1)),
              opacity 240ms ease;
}

/* Folder Header Row: 3/4 Header Tab + 1/4 Option Slot */
.project-folder-header-row {
  position: absolute;
  display: flex;
  align-items: flex-end;
  height: calc(var(--radius-lg) * 1.5);
  width: 100%;
  margin-top: calc(0px - calc(var(--radius-lg) * 1.5));
  padding: 0;
  box-sizing: border-box;
}

/* 3/4 Header Tab (74% width) */
.project-folder-tab {
  position: relative;
  height: calc(var(--radius-lg) * 1.5);
  width: calc(100% - 48px - 16px);
  background: var(--surface-folder);
  border-top: 1px solid var(--surface-folder-border);
  border-left: 1px solid var(--surface-folder-border);
  border-top-left-radius: var(--radius-lg);
  border-top-right-radius: var(--radius-lg);
  box-sizing: border-box;
  display: flex;
  align-items: center;
  padding-left: 16px;
  flex-shrink: 0;
}

/* Smooth S-curve inverse fillet connecting tab to shelf */
.project-folder-tab::after {
  content: "";
  position: absolute;
  right: 0;
  bottom: 0;
  transform: translateX(var(--radius-lg));
  width: var(--radius-lg);
  height: calc(var(--radius-lg) * 1.5 / 2);
  background: transparent;
  border-bottom-left-radius: var(--radius-lg);
  box-shadow: -6px 6px 0 0 var(--surface-folder);
  border-bottom: 1px solid var(--surface-folder-border);
  border-left: 1px solid var(--surface-folder-border);
  pointer-events: none;
}

@supports (corner-shape: squircle) {
  .project-folder-shell {
    corner-shape: squircle;
    border-radius: 0 var(--radius-continuous-lg) var(--radius-continuous-lg) var(--radius-continuous-lg);
  }

  .project-folder-tab {
    corner-shape: squircle;
    border-radius: var(--radius-continuous-lg) var(--radius-continuous-lg) 0 0;
  }

  .project-folder-header-row {
    left: -1px;
    width: calc(100% + 2px);
  }

  .project-folder-tab::before {
    content: '';
    position: absolute;
    inset-inline: 0;
    bottom: 0;
    height: 2px;
    background: var(--surface-folder);
    pointer-events: none;
  }

  /* This is a negative fillet, not a convex card corner. Keep a circular cutout
     with a full-depth fill below the arc. The tab's bridge covers the shell seam. */
  .project-folder-tab::after {
    --folder-fillet: 18px;
    corner-shape: round;
    right: calc(-1 * var(--folder-fillet));
    bottom: 0;
    transform: none;
    width: var(--folder-fillet);
    height: var(--folder-fillet);
    border-bottom-left-radius: var(--folder-fillet);
    box-shadow: -8px 8px 0 -1px var(--surface-folder);
  }
}

.project-folder-tab-dot {
  width: 5px;
  height: 5px;
  border-radius: 50%;
  background: rgba(148, 163, 184, 0.7);
}

/* Middle Shelf (remaining ~26% notch zone) */
.project-folder-shelf {
  flex: 1;
  height: 1px;
  background: var(--surface-folder-border);
  margin-bottom: 0px;
  margin-left: 16px;
}

/* Option Notch Wrap: Embedded with gap A ≈ gap B (10px ~ 14px) */
.project-folder-notch-wrap {
  position: relative;
  display: flex;
  align-items: flex-end;
  justify-content: flex-end;
  margin-bottom: 8px;  /* gap B to folder body ≈ 12px */
  flex-shrink: 0;
  margin-left: 8px;
}

.project-option-slot {
  position: relative;
  z-index: 40;
  flex-shrink: 0;
  display: flex;
  align-items: center;
}

/* Option Button: Unified with Folder Front Shell Surface */
.project-folder-card .project-option-btn,
.project-option-btn {
  width: 48px;
  height: calc(var(--radius-lg) * 1.5);
  border-radius: 9999px;
  background: var(--surface-folder);
  border: 1px solid var(--surface-folder-border);
  box-shadow: 0 1px 3px rgba(15, 23, 42, 0.04), inset 0 1px 0 rgba(255, 255, 255, 0.6);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  color: var(--folder-text-secondary);
  cursor: pointer;
  outline: none;
  padding: 0;
  box-sizing: border-box;
  transition: background 180ms ease,
              color 180ms ease,
              box-shadow 180ms ease,
              transform 180ms ease,
              border-color 180ms ease;
}

.project-folder-card .project-option-btn:hover,
.project-option-btn:hover {
  background: var(--surface-folder-highlight, #ffffff);
  color: var(--folder-text-primary, #0f172a);
  border-color: rgba(148, 163, 184, 0.65);
  box-shadow: 0 3px 8px rgba(15, 23, 42, 0.07);
  transform: translateY(-1px);
}

.project-folder-card .project-option-btn:active,
.project-option-btn:active {
  transform: scale(0.96);
  background: var(--surface-folder);
}

.project-option-btn.is-hidden-for-morph {
  opacity: 0 !important;
  pointer-events: none !important;
}

/* ── 4. Folder Content ── */
.project-folder-content {
  padding: 12px 20px 30px 20px;
  display: flex;
  flex-direction: column;
  gap: 8px;
  box-sizing: border-box;
  flex: 1;
  justify-content: flex-end;
}

.project-updated {
  font-size: 0.78rem;
  font-weight: 500;
  color: var(--folder-text-secondary);
  line-height: 1.2;
}

.project-title-wrapper {
  position: relative;
  width: 100%;
  overflow: hidden;
  mask-image: linear-gradient(to right, #000 calc(100% - 24px), transparent 100%);
  -webkit-mask-image: linear-gradient(to right, #000 calc(100% - 24px), transparent 100%);
  white-space: nowrap;
  padding: 2px 0;
}

.project-folder-card .project-title {
  display: inline-block;
  font-family: var(--font-family-display, inherit);
  font-size: 1.05rem;
  font-weight: 600;
  color: var(--folder-text-primary);
  line-height: 1.35;
  white-space: nowrap;
  transition: transform 0.35s var(--motion-ease-standard, cubic-bezier(.4, 0, .2, 1));
  will-change: transform;
}

.project-meta {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-top: 6px;
  flex-wrap: wrap;
}

.project-meta-pill {
  display: inline-flex;
  align-items: center;
  height: 26px;
  padding: 0 10px;
  border-radius: 9999px;
  background: var(--surface-meta);
  border: 1px solid rgba(226, 232, 240, 0.85);
  font-size: 0.75rem;
  font-weight: 500;
  color: var(--folder-text-secondary);
  line-height: 1;
}

.project-meta-pill.project-restore-badge {
  background: rgba(239, 68, 68, 0.08);
  border-color: rgba(239, 68, 68, 0.25);
  color: #dc2626;
  font-weight: 600;
}

/* ── 4.1 Project Tags Row & Pills ── */
.project-tags-row {
  display: flex;
  align-items: center;
  gap: 6px;
  flex-wrap: wrap;
  margin-top: 4px;
  margin-bottom: 2px;
}

.project-tag-pill {
  display: inline-flex;
  align-items: center;
  height: 22px;
  padding: 0 8px;
  border-radius: var(--radius-pill, 9999px);
  background: rgba(241, 245, 249, 0.85);
  border: 1px solid rgba(226, 232, 240, 0.9);
  font-size: 0.72rem;
  font-weight: 500;
  color: #475569;
  line-height: 1;
  cursor: pointer;
  transition: all 0.2s ease;
  user-select: none;
  font-family: inherit;
}

.project-tag-pill:hover {
  background: #e2e8f0;
  color: #1e293b;
  border-color: #cbd5e1;
  transform: translateY(-1px);
}

.project-tag-pill:active {
  transform: translateY(0);
}

.project-tag-pill-more {
  background: transparent;
  border: 1px dashed #cbd5e1;
  color: #94a3b8;
  font-size: 0.7rem;
  cursor: default;
}

.project-tags-row.project-tags-row-compact {
  gap: 4px;
  margin-top: 2px;
  margin-bottom: 0;
}

/* ── 5. Variants: Compact (Dashboard) vs Default / Full (Projects) ── */
.project-folder-card.variant-compact {
  max-width: 290px;
  padding-top: var(--folder-headroom-compact, 50px);
}

.project-folder-card.variant-compact .project-folder-shell {
  min-height: 124px;
}

.project-folder-card.variant-compact .project-folder-content {
  padding: 10px 16px 22px 16px;
  gap: 6px;
}

.project-folder-card.variant-compact .project-folder-preview-stack {
  height: 128px;
  margin-bottom: -44px;
}

.project-folder-card.variant-compact .project-preview-primary {
  width: var(--cover-width, var(--collapsed-width, 254px)) !important;
  height: var(--cover-height, var(--collapsed-height, 142.9px)) !important;
  aspect-ratio: 16 / 9 !important;
  max-width: 268px;
  max-height: 160px;
  transform: translateY(calc(var(--insert-depth, var(--collapsed-insert-depth, 42px)) - 44px)) translateX(0) rotate(0deg) scale(1);
}

.project-folder-card.variant-compact .project-preview-secondary {
  height: 124px;
  width: auto;
  aspect-ratio: 16 / 9;
}

/* ── 6. Hover Motion (Physical Storyboard Pull - Keep 16:9 Frame) ── */
.project-folder-card:hover .project-folder-shell,
.project-folder-card.is-expanded .project-folder-shell {
  transform: translateY(-2px);
  box-shadow: var(--folder-shadow-hover);
}

/* Primary Cover lifts and tilts without changing 16:9 aspect ratio */
.project-folder-card:hover .project-preview-primary,
.project-folder-card.is-expanded .project-preview-primary {
  width: var(--cover-width, var(--collapsed-width, 282px)) !important;
  height: var(--cover-height, var(--collapsed-height, 158.6px)) !important;
  transform: translateY(calc(var(--insert-depth, var(--collapsed-insert-depth, 46px)) - 46px - var(--hover-lift, 16px)))
             translateX(0)
             rotate(var(--hover-rotate, -4.5deg))
             scale(1.02);
  border-radius: var(--radius-continuous-14);
  box-shadow: 0 16px 36px rgba(15, 23, 42, 0.18);
}

.project-folder-card.variant-compact:hover .project-preview-primary,
.project-folder-card.variant-compact.is-expanded .project-preview-primary {
  width: var(--cover-width, var(--collapsed-width, 254px)) !important;
  height: var(--cover-height, var(--collapsed-height, 142.9px)) !important;
  transform: translateY(calc(var(--insert-depth, var(--collapsed-insert-depth, 42px)) - 44px - var(--hover-lift, 14px)))
             translateX(0)
             rotate(var(--hover-rotate, -4.5deg))
             scale(1.02);
  border-radius: var(--radius-continuous-14);
  box-shadow: 0 14px 30px rgba(15, 23, 42, 0.16);
}

.project-folder-card:hover .project-preview-secondary,
.project-folder-card.is-expanded .project-preview-secondary {
  transform: translateY(-8px) translateX(18px) rotate(6deg) scale(0.98);
  box-shadow: 0 8px 22px rgba(15, 23, 42, 0.12);
  opacity: 0.96;
}

.project-folder-card:hover .fallback-clapper {
  transform: scale(1.08) rotate(4deg);
}

/* ── 7. App-Level Transition Layer & Reveal Curtain (Phase 1～6) ── */
#transition-layer,
.app-transition-layer {
  position: fixed !important;
  inset: 0 !important;
  z-index: 999998 !important;
  pointer-events: none !important;
  overflow: hidden !important;
}

.project-reveal-scrim {
  position: fixed !important;
  inset: 0 !important;
  background: rgba(12, 19, 36, 0.55);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  opacity: 0;
  transition: opacity 320ms var(--motion-ease-standard, cubic-bezier(.4, 0, .2, 1));
  pointer-events: auto;
  z-index: 1;
}

.project-cover-waiting {
  position: fixed;
  z-index: 1000000;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 18px;
  width: min(340px, calc(100vw - 32px));
  transform: translateX(-50%) translateY(5px);
  color: rgba(255, 255, 255, .72);
  opacity: 0;
  visibility: hidden;
  transition: opacity 240ms ease, transform 240ms ease, visibility 240ms;
  pointer-events: none;
}

.project-cover-waiting.is-visible {
  opacity: 1;
  visibility: visible;
  transform: translateX(-50%);
}

.project-cover-rose-orbit {
  position: fixed;
  z-index: 999998;
  color: #fff;
  overflow: visible;
  fill: none;
  pointer-events: none;
  opacity: 0;
  visibility: hidden;
  transition: opacity 240ms ease, visibility 240ms;
}

.project-cover-rose-orbit.is-visible {
  opacity: 1;
  visibility: visible;
}

.project-cover-rose-front {
  z-index: 1000000;
}

.project-cover-rose-svg {
  display: block;
  width: 100%;
  height: 100%;
  overflow: visible;
}

.project-cover-cancel { color: #fff !important; }
.project-cover-waiting.is-visible .project-cover-cancel { pointer-events: auto; }
.project-cover-cancel:focus-visible { outline: 2px solid #fff !important; outline-offset: 4px; }

@media (prefers-reduced-motion: reduce) {
  .project-cover-waiting, .project-cover-rose-orbit { transition: none; }
}

.project-reveal-curtain,
.transition-cover-shell {
  position: fixed !important;
  border-radius: 14px;
  overflow: hidden;
  box-shadow: 0 16px 36px rgba(15, 23, 42, 0.2), 0 0 0 1px rgba(255, 255, 255, 0.35);
  transform-origin: 45% 100%;
  background: #0f172a;
  pointer-events: none;
  will-change: left, top, width, height, transform, opacity;
  z-index: 2;
  box-sizing: border-box;
}

.project-reveal-curtain.is-contain-shell,

    waitingUI.style.top = `${targetTop + targetH / 2 + loaderExtent * 0.46 + 20}px`;
    let rose = null;
    let orbit = null;
    let frontOrbit = null;
    if (document.createElementNS) {

        width: `${loaderSize}px`, height: `${loaderSize}px`

      const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
      path.setAttribute('fill', 'none');
      path.setAttribute('stroke', 'currentColor');
      path.setAttribute('opacity', '0.18');
      path.setAttribute('stroke-width', '4.5');
      path.setAttribute('stroke-linecap', 'round');
      path.setAttribute('stroke-linejoin', 'round');
      group.appendChild(path);
      svg.appendChild(group);
      orbit.appendChild(svg);
      transitionLayer.appendChild(orbit);
      // Separate layers share one animation clock: far arcs pass behind the
      // cover, while near arcs and particles pass in front of it.
      frontOrbit = document.createElement('div');
      frontOrbit.className = 'project-cover-rose-orbit project-cover-rose-front';
      Object.assign(frontOrbit.style, {
        left: orbit.style.left, top: orbit.style.top,
        width: orbit.style.width, height: orbit.style.height
      });
      const frontSvg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
      frontSvg.setAttribute('viewBox', '0 0 100 100');
      frontSvg.setAttribute('aria-hidden', 'true');
      frontSvg.classList.add('project-cover-rose-svg');
      const frontGroup = document.createElementNS('http://www.w3.org/2000/svg', 'g');
      const frontPath = document.createElementNS('http://www.w3.org/2000/svg', 'path');
      frontPath.setAttribute('fill', 'none');
      frontPath.setAttribute('stroke', 'currentColor');
      frontPath.setAttribute('stroke-linecap', 'round');
      frontPath.setAttribute('stroke-linejoin', 'round');
      frontGroup.appendChild(frontPath);
      frontSvg.appendChild(frontGroup);
      frontOrbit.appendChild(frontSvg);
      transitionLayer.appendChild(frontOrbit);
      const svgNS = 'http://www.w3.org/2000/svg';
      const defs = document.createElementNS(svgNS, 'defs');
      const trackMask = document.createElementNS(svgNS, 'mask');
      const maskId = `rose-track-${Date.now()}-${Math.random().toString(36).slice(2)}`;
      trackMask.setAttribute('id', maskId);
      trackMask.setAttribute('maskUnits', 'userSpaceOnUse');
      trackMask.setAttribute('x', '-50');
      trackMask.setAttribute('y', '-50');
      trackMask.setAttribute('width', '200');
      trackMask.setAttribute('height', '200');
      const maskBackground = document.createElementNS(svgNS, 'rect');
      maskBackground.setAttribute('x', '-50');
      maskBackground.setAttribute('y', '-50');
      maskBackground.setAttribute('width', '200');
      maskBackground.setAttribute('height', '200');
      maskBackground.setAttribute('fill', '#fff');
      const maskPath = document.createElementNS(svgNS, 'path');
      maskPath.setAttribute('fill', 'none');
      maskPath.setAttribute('stroke', '#000');
      maskPath.setAttribute('stroke-linecap', 'round');
      maskPath.setAttribute('stroke-linejoin', 'round');
      trackMask.appendChild(maskBackground);
      trackMask.appendChild(maskPath);
      defs.appendChild(trackMask);
      svg.appendChild(defs);
      path.setAttribute('mask', `url(#${maskId})`);

    }
    const cancelButton = document.createElement('button');
    cancelButton.className = 'qc-close-btn project-cover-cancel';
    cancelButton.type = 'button';
    cancelButton.textContent = 'X';
    cancelButton.setAttribute('aria-label', '中斷開啟專案，返回原頁面');
    cancelButton.title = '中斷開啟專案';
    waitingUI.appendChild(cancelButton);
    transitionLayer.appendChild(waitingUI);
    const reducedMotion = root.matchMedia?.('(prefers-reduced-motion: reduce)').matches;
    let navTimer = null;


    if (primaryCover.style) primaryCover.style.visibility = 'hidden';
    requestAnimationFrame(() => {
      if (scrim.style) scrim.style.opacity = '1';
    });

    // Transition Session Controller (Shared Element State Machine)
    const session = {
      id: `cover-trans-${p.id}-${Date.now()}`,
      projectId: p.id,
      targetRoute: `/project/${p.id}`,
      card,
      primaryCover,
      folderShell,
      secondary,
      flyingCover,
      scrim,
      flightAnim: null,
      targetLeft,
      targetTop,
      targetW,
      targetH,
      state: 'extracting', // 'extracting' | 'flying' | 'waiting-project' | 'returning' | 'handoff' | 'complete' | 'cancelled'
      cancelled: false,
      pendingTarget: null,

      showWaiting() {
        if (this.cancelled || this.state !== 'waiting-project') return;
        waitingUI.classList.add('is-visible');
        orbit?.classList.add('is-visible');
        frontOrbit?.classList.add('is-visible');
        if (!reducedMotion) rose?.start();

      },

      hideWaiting() {
        waitingUI.classList.remove('is-visible');
        orbit?.classList.remove('is-visible');
        frontOrbit?.classList.remove('is-visible');
        cancelButton.disabled = true;
        rose?.stop();
      },

      interrupt() {
        if (this.cancelled || this.state === 'complete' || this.state === 'returning' || this.state === 'handoff') return;
        this.cancelled = true;
        this.state = 'cancelled';
        this.hideWaiting();
        clearTimeout(navTimer);
        // Freeze the current visual before removing the flight animation's fill.
        const from = this.flyingCover.getBoundingClientRect();
        this.flightAnim?.cancel();
        if (this.flyingCover.style) {
          Object.assign(this.flyingCover.style, { left: `${from.left}px`, top: `${from.top}px`, width: `${from.width}px`, height: `${from.height}px`, transform: 'none' });
        }
        this.cancelOpening?.();
        const canReturn = this.card.isConnected !== false && document.body.contains(this.card);
        const to = canReturn ? this.primaryCover.getBoundingClientRect() : null;
        const keyframes = to && to.width > 0 && to.height > 0 ? [
          { left: `${from.left}px`, top: `${from.top}px`, width: `${from.width}px`, height: `${from.height}px`, opacity: 1 },
          { left: `${to.left}px`, top: `${to.top}px`, width: `${to.width}px`, height: `${to.height}px`, borderRadius: coverRadius(14), opacity: 1 }
        ] : [{ opacity: 1, filter: 'blur(0px)' }, { opacity: 0, filter: 'blur(18px)', transform: 'scale(.97)' }];
        this.scrim.style.opacity = '0';
        const exit = this.flyingCover.animate?.(keyframes, { duration: reducedMotion ? 0 : 380, easing: 'cubic-bezier(.4, 0, .2, 1)', fill: 'forwards' });
        if (exit) exit.onfinish = () => this.cleanup();
        else this.cleanup();
      },

      onFirstShotReady(targetWrap, targetImg) {
        if (this.state === 'complete' || this.state === 'returning' || this.cancelled) return;
        if (this.state === 'extracting' || this.state === 'flying') {
          this.pendingTarget = { targetWrap, targetImg };

        }
        this.executeReturn(targetWrap, targetImg);
      },

      executeReturn(targetWrap, targetImg) {
        if (this.state === 'complete' || this.state === 'returning' || this.cancelled) return;
        this.state = 'returning';
        this.hideWaiting();

        // Wait 2 requestAnimationFrame frames to guarantee layout stability
        requestAnimationFrame(() => {
          requestAnimationFrame(() => {
            if (this.cancelled || this.state === 'complete') return;
            if (!targetWrap || (targetWrap.isConnected !== undefined && !targetWrap.isConnected)) {
              this.cancel();
              return;
            }

            // Plan Section 3 & 4: Get actual visible contained image rect
            const imgEl = targetImg || (targetWrap.querySelector ? targetWrap.querySelector('img') : null) || targetWrap;
            const targetRect = getContainedImageRect(imgEl) || (targetWrap.getBoundingClientRect ? targetWrap.getBoundingClientRect() : null);
            if (!targetRect || targetRect.width <= 0 || targetRect.height <= 0) {
              this.cancel();
              return;
            }

            // Plan Section 1: Lock Cover Dimensions from Center Hold
            const sourceRect = this.flyingCover?.getBoundingClientRect ? this.flyingCover.getBoundingClientRect() : null;
            if (!sourceRect || sourceRect.width <= 0 || sourceRect.height <= 0) {
              this.cancel();
              return;
            }

            // Plan Section 2: Uniform Scale & Translation
            const scale = targetRect.width / sourceRect.width;
            const dx = targetRect.left - sourceRect.left;
            const dy = targetRect.top - sourceRect.top;

            if (this.flyingCover?.style) {
              this.flyingCover.style.transformOrigin = 'top left';
            }

            // Scrim fades out smoothly
            if (this.scrim && this.scrim.style) {
              this.scrim.style.transition = 'opacity 320ms cubic-bezier(.4, 0, .2, 1)';
              this.scrim.style.opacity = '0';
            }

            // Plan Section 6: First Shot remains hidden during return
            if (targetWrap.style) {
              targetWrap.style.opacity = '0';
            }

            const targetRadius = root.getComputedStyle?.(targetWrap).borderTopLeftRadius || coverRadius('sm');
            const endRadius = Math.max(2, Math.round(parseFloat(targetRadius) / scale));

            // Plan Section 2 & 9: Return ONLY animates translate + uniform scale + border-radius + shadow.
            if (!this.flyingCover || typeof this.flyingCover.animate !== 'function') {
              this.cleanup();
              return;
            }

            const returnAnim = this.flyingCover.animate([
              {
                transform: 'translate(0px, 0px) scale(1)',
                borderRadius: coverRadius(10),
                boxShadow: '0 32px 80px rgba(0, 0, 0, 0.45)'
              },
              {
                transform: `translate(${dx}px, ${dy}px) scale(${scale})`,
                borderRadius: `${endRadius}px`,
                boxShadow: '0 2px 8px rgba(0, 0, 0, 0.08)'
              }
            ], {
              duration: 380,
              easing: 'cubic-bezier(.4, 0, .2, 1)',
              fill: 'forwards'
            });

            returnAnim.onfinish = () => {
              if (this.cancelled) return;
              this.state = 'handoff';

              // Plan Section 7: Seamless handoff (60~120ms crossfade)

                if (targetWrap.classList) targetWrap.classList.remove('is-transition-target');
                if (targetWrap.style) {
                  targetWrap.style.transition = 'opacity 90ms ease';
                  targetWrap.style.opacity = '1';
                }
              }

              if (!this.flyingCover || typeof this.flyingCover.animate !== 'function') {
                this.cleanup();
                return;
              }

              const crossFade = this.flyingCover.animate([
                { opacity: 1 },
                { opacity: 0 }
              ], {
                duration: 90,
                fill: 'forwards'
              });

                this.cleanup();
              };
            };

        });
      },

      cancel() {
        if (this.state === 'complete' || this.cancelled) return;
        this.cancelled = true;
        this.hideWaiting();
        this.state = 'cancelled';
        this.runLegacyCoverShrink();
      },

      fallbackDismiss() {
        this.cancel();
      },

      runLegacyCoverShrink() {
        if (this.state === 'complete') return;
        this.state = 'cancelled';

        if (this.flightAnim) {
          try { this.flightAnim.cancel(); } catch (e) {}
        }

        if (this.scrim && this.scrim.style) {

          this.scrim.style.opacity = '0';

          return;

          { transform: 'scale(1)', opacity: 1 },
          { offset: 0.22, transform: 'scale(1.015)', opacity: 0.98 },

        this.hideWaiting();

        removeNode(waitingUI);
        removeNode(orbit);
        removeNode(frontOrbit);
        cancelButton.onclick = null;
        this.state = 'complete';

        removeNode(this.scrim);
        this.scrim = null;

        removeNode(this.flyingCover);
        this.flyingCover = null;

        removeNode(frostedOverlay);
        frostedOverlay = null;

          if (window.currentCoverTransition === this) window.currentCoverTransition = null;
        }
        if (typeof global !== 'undefined') {
          if (global._activeProjectTransition === this) global._activeProjectTransition = null;
          if (global.currentCoverTransition === this) global.currentCoverTransition = null;
        }

    cancelButton.onclick = () => session.interrupt();
    if (typeof window !== 'undefined') {
      window.currentCoverTransition = session;
      window._activeProjectTransition = session;
    }
    if (typeof global !== 'undefined') {
      global.currentCoverTransition = session;
      global._activeProjectTransition = session;
    }
    if (root && root !== window) {
      root.currentCoverTransition = session;
      root._activeProjectTransition = session;
    }

        if (typeof navFn === 'function') {

        }

    // Spec Section 9, 11, 12, 13: Flight Morph Keyframes (0 - 520ms)

    const flightKeyframes = [
      {
        offset: 0,
        left: `${startLeft}px`,
        top: `${startTop}px`,
        width: `${startW}px`,
        height: `${startH}px`,
        transform: 'rotate(-4.5deg) scale(1)',
        borderRadius: coverRadius(14),
        borderWidth: '1px',
        boxShadow: '0 16px 36px rgba(15, 23, 42, 0.2), 0 0 0 1px rgba(255, 255, 255, 0.35)'
      },
      {
        offset: 0.20,
        left: `${startLeft + (targetLeft - startLeft) * 0.12}px`,
        top: `${startTop - 28}px`,
        width: `${startW}px`,
        height: `${startH}px`,
        transform: 'rotate(-3.5deg) scale(1.02)',
        borderRadius: `calc((${coverRadius(14)} + ${coverRadius(12)}) / 2)`,
        borderWidth: '1px',
        boxShadow: '0 24px 52px rgba(0, 0, 0, 0.35), 0 0 0 1px rgba(255, 255, 255, 0.25)'
      },
      {
        offset: 0.60,
        left: `${startLeft + (targetLeft - startLeft) * 0.78}px`,
        top: `${Math.min(startTop, targetTop) - 14 + (targetTop - startTop) * 0.65}px`,
        width: `${targetW}px`,
        height: `${targetH}px`,
        transform: 'rotate(-0.8deg) scale(1.01)',
        borderRadius: coverRadius(10),
        borderWidth: '0.5px',
        boxShadow: '0 32px 72px rgba(0, 0, 0, 0.42), 0 0 0 1px rgba(255, 255, 255, 0.15)'
      },
      {
        offset: 1,
        left: `${targetLeft}px`,
        top: `${targetTop}px`,
        width: `${targetW}px`,
        height: `${targetH}px`,
        transform: 'rotate(0deg) scale(1)',
        borderRadius: coverRadius(10),
        borderWidth: '0px',
        boxShadow: '0 32px 80px rgba(0, 0, 0, 0.45), 0 0 0 0px rgba(255, 255, 255, 0)'
      }
    ];

    if (typeof flyingCover.animate === 'function') {
      const anim = flyingCover.animate(flightKeyframes, {
        duration: 520,
        easing: 'cubic-bezier(.4, 0, .2, 1)',
        fill: 'forwards'
      });
      session.flightAnim = anim;

      if (bgImg && typeof bgImg.animate === 'function') {
        bgImg.animate([
          { offset: 0, opacity: 0.42 },
          { offset: 0.20, opacity: 0.42 },
          { offset: 0.40, opacity: 0.18 },
          { offset: 0.60, opacity: 0 },
          { offset: 1, opacity: 0 }
        ], {
          duration: 520,
          easing: 'cubic-bezier(.4, 0, .2, 1)',
          fill: 'forwards'
        });
      }

      if (frostedOverlay && typeof frostedOverlay.animate === 'function') {
        frostedOverlay.animate([
          { offset: 0, opacity: 1 },
          { offset: 0.20, opacity: 1 },
          { offset: 0.40, opacity: 0.4 },
          { offset: 0.60, opacity: 0 },
          { offset: 1, opacity: 0 }
        ], {
          duration: 520,
          easing: 'cubic-bezier(.4, 0, .2, 1)',
          fill: 'forwards'
        });
      }

      // Spec Section 15: Main Image Inner Wrap Morph
      if (mainImgWrap && isContain && typeof mainImgWrap.animate === 'function') {
        const innerW_start = Math.round(startH * projectRatio * 10) / 10;
        const innerH_start = startH;

        mainImgWrap.animate([
          { offset: 0, width: `${innerW_start}px`, height: `${innerH_start}px` },
          { offset: 0.20, width: `${innerW_start}px`, height: `${innerH_start}px` },
          { offset: 0.60, width: `${targetW}px`, height: `${targetH}px` },
          { offset: 1, width: `${targetW}px`, height: `${targetH}px` }

          duration: 520,
          easing: 'cubic-bezier(.4, 0, .2, 1)',
          fill: 'forwards'
        });

        triggerNav(); // Safety fallback

        if (session.state === 'complete' || session.cancelled) return;

        // Settle fixed in center with true project ratio
        flyingCover.style.left = `${targetLeft}px`;
        flyingCover.style.top = `${targetTop}px`;
        flyingCover.style.width = `${targetW}px`;
        flyingCover.style.height = `${targetH}px`;
        flyingCover.style.transform = 'none';
        flyingCover.style.borderRadius = coverRadius(10);
        flyingCover.style.borderWidth = '0px';
        flyingCover.style.opacity = '1';
        flyingCover.style.background = 'transparent';

        if (bgImg) removeNode(bgImg);
        bgImg = null;
        if (frostedOverlay) removeNode(frostedOverlay);
        frostedOverlay = null;

        // Normalize Media Layer completely at Center Hold
        if (mainImgWrap && mainImgWrap.style) {
          mainImgWrap.style.position = 'relative';
          mainImgWrap.style.inset = '0';
          mainImgWrap.style.left = '0';
          mainImgWrap.style.top = '0';
          mainImgWrap.style.width = '100%';
          mainImgWrap.style.height = '100%';
          mainImgWrap.style.transform = 'none';
          mainImgWrap.style.display = 'flex';
          mainImgWrap.style.alignItems = 'center';
          mainImgWrap.style.justifyContent = 'center';
          mainImgWrap.style.overflow = 'hidden';
        }
        if (mainImgClone && mainImgClone.style) {
          mainImgClone.style.width = '100%';
          mainImgClone.style.height = '100%';
          mainImgClone.style.objectFit = isContain ? 'contain' : 'cover';
          mainImgClone.style.objectPosition = 'center';
          mainImgClone.style.transform = 'none';
          mainImgClone.style.filter = 'none';
          mainImgClone.style.display = 'block';
        }

        session.state = 'waiting-project';

        // If First Shot already arrived while extracting/flight, execute return immediately
        if (session.pendingTarget) {
          const { targetWrap, targetImg } = session.pendingTarget;
          session.pendingTarget = null;
          session.executeReturn(targetWrap, targetImg);
        } else session.showWaiting();
      };
    } else {
      // Headless / Non-animation fallback
      triggerNav();
      session.state = 'waiting-project';
      session.showWaiting();
    }

    return session;
  }

  function getActiveTransition(projectId) {
    if (activeTransitionSession) {
      if (!projectId || String(activeTransitionSession.projectId) === String(projectId)) {
        return activeTransitionSession;
      }
    }
    return null;
  }

  function cancel(projectId) {
    const active = getActiveTransition(projectId);
    if (active) {
      active.cancel();
    }
  }

  function cleanup() {
    if (activeTransitionSession) {
      activeTransitionSession.cleanup();
    }
  }

  const ProjectCoverTransition = {
    launch,
    getActiveTransition,
    cancel,
    cleanup
  };

  // Mount on global window / root
  const rootObj = typeof window !== 'undefined' ? window : (typeof globalThis !== 'undefined' ? globalThis : root);

  function createBridges(target) {
    if (!target) return;
    target.ProjectCoverTransition = ProjectCoverTransition;
    target.launchProjectRevealTransition = function launchProjectRevealTransition(card, p, options) {
      return ProjectCoverTransition.launch(card, p, options);
    };
  }

  createBridges(rootObj);
  if (typeof global !== 'undefined' && global !== rootObj) {
    createBridges(global);
  }
  if (typeof window !== 'undefined' && window !== rootObj) {
